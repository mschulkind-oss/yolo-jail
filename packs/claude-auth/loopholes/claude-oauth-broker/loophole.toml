# A loophole contributed by the official `claude-auth` pack, which `claude` needs. See
# internal/loopholedecl for the schema. The generated CA and leaf state live under
# ~/.local/share/yolo-jail/state/claude-oauth-broker/ (writable); this file is in the pack's staged
# tree, mounted :ro.
#
# It is a contribution of `packs/claude-auth`, not a pack of its own (docs/reference/loophole-system.md
# OQ-A10, docs/design/provider-enablement.md OQ-PE5): it exists to serve the Claude subscription, so
# it rides with the pack that declares that subscription's provider and profile, and `packs/claude`
# needs that pack. Selecting the claude pack brings it, with no second selection step. A user who
# does not want it (a Bedrock setup, where no OAuth token is ever refreshed) declares `supersedes`
# on the `claude-oauth-refresh` capability.
name = "claude-oauth-broker"
description = "Serializes Claude OAuth refreshes so multi-jail setups don't burn the single-use refresh token. TLS termination lives inside each jail; a host-side daemon owns the flock + shared credentials file."
version = 1
# It runs whenever its pack is selected, like every loophole, and must not gain a way to be
# silently off: a jail-only claude user who loses it runs unserialized single-use refresh-token
# races against Anthropic (agent-credentials.md §2.5). It keeps the credential you already asked
# for from being burnt, so it declares nothing to grant.
# The named job this loophole implements: serializing OAuth token refreshes so concurrent consumers
# do not burn a single-use refresh token (docs/reference/pack-system.md). On its own this changes
# nothing; it becomes load-bearing when a selected pack declares `supersedes` for it with a reason
# (a Bedrock auth pack, under which the job does not exist). That is the one off switch that does
# not mean deselecting a pack the user needs.
#
# There is no `requires.command_on_path = "claude"`: a host-side LookPath read false for a jail-only
# user, who installs claude inside the jail, and the loophole vanished with no reason given. A
# loophole whose program is missing fails loudly at spawn instead.
serves = ["claude-oauth-refresh"]
# The transport is the hop a jail dials: the framework's loopback-TLS front over the daemon's
# socket (see host_daemon). Interception is declared by `intercepts`, `broker_ip` and `ca_cert`,
# and only those wire it.
transport = "loopback-tls"
lifecycle = "spawned"
intercepts = [{ host = "platform.claude.com" }]
# Jail-local loopback: the jail_daemon terminates TLS on 127.0.0.1:443 inside the container's
# network namespace (unprivileged there). No host port binding.
broker_ip = "127.0.0.1"
# {state} is the per-loophole writable state dir, keyed by the loophole name, so an upgrading host
# keeps its CA and every running jail keeps trusting it. The generated CA and leaf pair live there,
# not in the pack's staged tree.
ca_cert = "{state}/ca.crt"
# The only files from {state} that cross into a jail (issue #33). Without this key the whole state
# dir is mounted :ro, which put the CA's private key inside every jail where nothing reads it:
# signing happens host-side in internal/oauthbroker/cert.go. ca.key, ca.srl, leaf.cnf and
# refresh.lock are host-side bookkeeping and stay host-side.
state_files = ["ca.crt", "server.crt", "server.key"]
jail_daemon = { cmd = ["yolo-jaild", "oauth-terminator"], restart = "on-failure" }
doctor_cmd = ["yolo", "internal", "daemon", "claude-oauth-broker", "--self-check"]

# One broker per jail, started by the launch and stopped with it
# (docs/design/host-daemon-ownership.md, HD-R1). What stops two jails burning the same single-use
# refresh token (docs/reference/agent-credentials.md §2.5) is not one process: it is the one
# credentials file every copy reads and the refresh flock beside it, which every copy takes before
# it redeems the token.
#
# `publishes = "socket"` is required of a pack-shipped loophole: the daemon binds {socket}, a path
# yolo derives from this jail and this loophole's name, and yolo runs the jail's loopback-TLS front
# over it. The jail-facing hop is that front's endpoint file at
# /run/yolo-services/claude-oauth-broker.endpoint, named by
# YOLO_SERVICE_CLAUDE_OAUTH_BROKER_ENDPOINT. It carries this jail's bearer token, so it is written
# 0600 into the jail's own directory, and there is deliberately no token environment variable,
# because every child process the in-jail terminator spawns would inherit it.
#
# `preamble` is not declared: the daemon reads yolo's connection preamble
# (hostservice.ServeFrontedUnix), which is what makes the jail_id on its audit line host-asserted.
# Writing `false` would silently blind it.
#
# `detach`: a jail's end SIGTERMs this daemon and does not wait for it or kill it
# (docs/design/host-daemon-ownership.md §1.3). A refresh in flight may already have redeemed the
# single-use refresh token upstream, so the daemon finishes it, writes the shared credentials file,
# and exits on its own, bounded by its upstream timeout.
[host_daemon]
cmd = ["yolo", "internal", "daemon", "claude-oauth-broker", "--socket", "{socket}"]
publishes = "socket"
detach = true
