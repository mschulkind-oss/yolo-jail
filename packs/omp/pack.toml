model_list_check = { oh-omp = {} }
name = "omp"
# EACH SESSION'S OWN CONFIG DIRECTORY (docs/design/per-session-profiles.md §7, SP-D37): oh-omp
# reads stock pi's PI_CODING_AGENT_DIR (`new DirResolver(process.env.PI_CODING_AGENT_DIR)`) and
# keeps everything below in that directory. The shared names are every agent-dir entry the
# 0.15.3 linux-x64 binary's text names (read 2026-11-06, never run): its SQLite stores (logins
# are agent.db's; SQLite puts a linked database's -wal and -shm beside the target, measured with
# bun:sqlite 3.53.0), its user files and its state directories.
session_homes = [{ dir = ".oh-omp/agent", env = "PI_CODING_AGENT_DIR", shared = ["agent.db", "history.db", "models.db", "tool-results.db", "concept-graph.db", "mcp.json", "ssh.json", "secrets.yml", "workspace-trust.yml", "smithery.json", "kimi-device-id", "keybindings.json", "omp-crash.log", "oh-omp-debug.log", "sessions/", "blobs/", "search-db/", "memories/", "terminal-sessions/", "tools/", "prompts/", "modules/", "themes/", "commands/", "cache/", "agents/", "pycache/", "python-gateway/", "webcache/", "tasks.lance/"] }]

[[program]]
bin = "oh-omp"
# omp's own providers, read from the oh-omp 0.15.3 linux-x64 binary's strings on 2026-10-05,
# never run: every provider its bundled packages/ai/src/models.json lists, and the local and
# gateway ones its key map (serviceProviderMap) adds. yolo writes no model entry over one
# (docs/design/pi-codex-provider-shadowing.md OQ-3). omp's own zai speaks Anthropic Messages
# at api.z.ai/api/anthropic, the coding plan's Anthropic route (packs/zai/README.md),
# reading ZAI_API_KEY, so yolo's zai needs no plan.
built_in_providers.names = [
  "alibaba-coding-plan",
  "amazon-bedrock",
  "anthropic",
  "azure-openai-responses",
  "cerebras",
  "cloudflare-ai-gateway",
  "cursor",
  "deepseek",
  "github-copilot",
  "gitlab-duo",
  "google",
  "google-antigravity",
  "google-gemini-cli",
  "google-vertex",
  "groq",
  "huggingface",
  "kilo",
  "kimi-code",
  "litellm",
  "llama.cpp",
  "lm-studio",
  "minimax",
  "minimax-cn",
  "minimax-code",
  "minimax-code-cn",
  "mistral",
  "moonshot",
  "nanogpt",
  "nvidia",
  "ollama",
  "openai",
  "openai-codex",
  "opencode",
  "opencode-go",
  "opencode-zen",
  "openrouter",
  "qianfan",
  "qwen-portal",
  "runpod",
  "synthetic",
