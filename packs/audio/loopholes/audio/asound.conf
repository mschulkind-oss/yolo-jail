# ALSA → PipeWire routing, delivered by the OFFICIAL `audio` pack's `audio` loophole.
# Bind-mounted read-only into the jail at /etc/alsa/conf.d/50-yolo-audio-alsa.conf.
#
# WHY conf.d AND NOT /etc/asound.conf. The destination was chosen to avoid a
# collision that no longer exists: the bundled `audio` loophole used to bind its own
# copy of this content at /etc/asound.conf, and podman refuses two binds on one
# destination whose sources differ ("duplicate mount destination" — measured), so a
# jail that had both would have REFUSED TO START. The bundled copy is gone (the two
# loopholes merged on 2026-08-18), and the choice survives it: alsa-lib's own
# alsa.conf loads /etc/alsa/conf.d BEFORE /etc/asound.conf (measured in its @hooks
# include list), this is the spelling measured working here, and moving to the freed
# path would be an unmeasured edit made for tidiness. Measured in this repo's jail
# image, all three cases, with sox (a real libasound client):
#
#   neither file          → "cannot find card '0'"        (unrouted: the bug)
#   conf.d fragment only  → reaches libasound_module_pcm_pipewire.so   (routed)
#   BOTH, together        → identical to conf.d only; NO duplicate-definition error
#
# The last line is the one that matters: `pcm.!default` appearing in both files is
# not an ALSA error — the later definition simply overrides, and both carry the
# same value.
#
# What it does: tells libasound that the "default" PCM/CTL device is the PipeWire
# shim rather than the hardware fallback `hw:0,0`. Without it, anything that
# dlopens libasound and calls snd_pcm_open("default") — Claude Code's voice mode is
# the canonical example — makes ALSA enumerate /dev/snd/card0, which a jail has no
# reason to have, and dies with `cannot find card '0'`.
#
# The plugin path is spelled explicitly because alsa-lib's built-in plugin search
# path is its own nix store libdir, not the merged /lib/alsa-lib/ that picks up the
# pipewire shim. The shim itself ships with nixpkgs' `pipewire` package and is
# present only when the workspace pulls it in — which was true of the bundled
# loophole too, and is not something this pack changed.

pcm_type.pipewire {
    lib "/lib/alsa-lib/libasound_module_pcm_pipewire.so"
}

ctl_type.pipewire {
    lib "/lib/alsa-lib/libasound_module_ctl_pipewire.so"
}

pcm.!default {
    type pipewire
}

ctl.!default {
    type pipewire
}
