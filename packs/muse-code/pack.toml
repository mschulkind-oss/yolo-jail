name = "muse-code"
description = "Meta's Muse Code CLI as a first-class yolo agent (`muse`): installed from Meta's public one-line installer (https://dev.meta.ai/install.sh — no Meta account, no API key; there is no npm, brew or pacman package and no public mirror), with a settings surface for ~/.config/muse/settings.json plus the user-level briefing and skills destinations under ~/.config/muse. It runs on the local Muse subscription login; no API key is involved anywhere in this pack."

# THE MUSE CODE AGENT. The binary is `muse`, installed by Meta's one-line shell installer
# (https://dev.meta.ai/install.sh): `curl -fsSL https://dev.meta.ai/install.sh | sh`.
# `url` is the script, not the pipeline — packdecl's `via: "installer"` remedy is
# `curl <url> | sh` behind the installer-check gate, the same shape the `agy`, `claude`
# and `codex` packs declare.
#
# THE INSTALLER IS PUBLIC, WITH AN OPTIONAL AUTHENTICATED FAST PATH, and it is not a
# gate. Meta serves the installer and the ~344 MiB binary it downloads from a plain
# public URL: the fetch is tried WITHOUT auth first, and a bearer token is attached only
# to `lookaside.facebook.com` URLs, and only when `~/.config/muse/auth.json` already
# exists. Measured here: the binary downloaded unauthenticated with no `auth.json` and no
# `META_API_KEY`, so a jail outside Meta's network installs it normally and the
# real-install cells of .github/workflows/packs.yml and .github/workflows/macos-user.yml
# (which run `muse --version` in a real jail) are not gate-blocked. The manifest has no
# `install_hints` for the reason the note below gives — no npm, brew or pacman package
# exists.
#
# `probe_args` is the one-word version probe the per-pack install matrix runs; `muse
# --version` answers it. There is deliberately no `update` (Meta documents no
# self-update verb) and no `install_hints` (installer-only distribution: no npm, brew
# or pacman package).
#
# NO `protocols` AND NO `launch_selection`, deliberately, and both are omissions rather
# than oversights. `protocols` names the wire protocols a CLI can be POINTED AT, and
# Meta documents no provider list for Muse Code at all — declaring one would be a guess
# core would then resolve a pairing against, and this pack declares no provider to pair
# with. `launch_selection` is how `yolo host -p <profile> -- muse` hands a selection to
# a CLI without touching its settings file, and nothing documents which settings key or
# flag carries a model for one launch.
[[program]]
bin = "muse"
probe_args = ["--version"]
url = "https://dev.meta.ai/install.sh"
via = "installer"
install = false

# ITS SETTINGS FILE. Meta's docs: user settings live at ~/.config/muse/settings.json, and
# a present file without `"schema_version": 1` is bad enough that the CLI refuses to
# start (`malformed settings file …`), while an absent file is fine. So the key is the one
# thing this surface has to guarantee, and it is `managed` (the top layer, re-asserted at
# every render): a captured in-jail edit folds BELOW managed, so on-disk content cannot
# defeat it, and a user who deleted the key cannot brick the CLI.
#
# THERE ARE TWO `schema_version` KEYS, NOT ONE, and the second one is the one that bit.
# `permissions` is not a plain table of knobs: Muse reads that VALUE as its own settings
# document (`UserPermissionSettingsV1`, whose required first field is `schema_version`),
# so a `permissions` object without its own `"schema_version": 1` fails at startup with
# `Named permission profiles are unavailable: missing field schema_version …` — measured
# against Muse Code 1.4.6, where the reported position is relative to THAT sub-document
# (`line 3 column 3` for a three-line `permissions` object), which is why the error names
# a line the settings file's own `schema_version` already occupies. It is `managed` for
# the same reason as the top-level one: without it every `muse` command exits 1.
#
# GENERALIZED: the read-only permission default this pack was derived from
# (`permissions.default_profile` in the `defaults` layer) is DROPPED here. It is the
# original owner's choice and this pack has no basis for it. Add it back as a `defaults`
# entry (NEVER `managed`: managed would make the interactive CLI read-only with no way for
# the owner to change it in place) if you want the interactive CLI to start read-only; the
# `muse-planner` pack pins its own posture per run instead.
#
# IF YOU DO NAME ONE, THE PROFILE IDS CARRY A LEADING COLON: `:read-only`, `:ask-me`,
# `:auto-review`, `:unrestricted`. The colon is the id, not decoration, and the bare
# `read-only` resolves to nothing — the CLI exits 1 with `Permission profile 'read-only'
# is unavailable: profile does not exist`. The unprefixed strings are the catalog's
# display names (`Read only`), not ids.
#
# Nothing else is stated: no model default, TUI preference, toolset narrowing or
# telemetry choice. The surface is `stateful` (the default mode), so whatever the CLI or
# the owner writes into the file is captured and survives regeneration.
[[config]]
config = [{ agent = "muse", managed = { permissions = { schema_version = 1 }, schema_version = 1 }, name = "settings", path = "~/.config/muse/settings.json" }]

# THE TRUST PRE-ANSWER — the file that stops Muse's "Do you trust this workspace?" dialog
# from parking every launch. Muse asks that dialog BEFORE the model runs and before any
# project-local skills, rules, hooks or plugin config load, so an unanswered one is not a
# rough edge: the user never reaches a running agent. The answer persists in a USER-GLOBAL
# store at `$XDG_CONFIG_HOME/muse/trust.json` (default `~/.config/muse/trust.json`; yolo
# never sets XDG_CONFIG_HOME) keyed by the CANONICAL absolute project root, which Muse takes
# from the LAUNCH DIRECTORY (`muse: workspace root: <cwd> (cwd default)`) and matches
# exactly — a trusted parent does not trust a subdirectory (measured, Muse Code 1.4.14). Inside
# a jail the workspace is literally `/workspace`, so one `${workspace}` entry covers a `muse`
# started there in every jail; a `muse` started in a subdirectory is trusted by the
# autonomous posture's `--yolo` below instead.
#
# PROVEN AGAINST THE BINARY (Muse Code 1.4.7-R6101.1), both directions. With no file, the
# interactive TUI opens on `Do you trust this workspace? / Workspace: /workspace / 1 Trust
# and continue / 2 Quit` and `muse exec` prints `muse: Agent delegation: auto unavailable:
# workspace is untrusted.`; with `{"schema_version":1,"projects":{"/workspace":{"decision":
# "trusted"}}}` on disk the TUI proceeds and `muse exec` prints `muse: workspace trust:
# trusted source=user-config`. The exact shape is load-bearing: a string value is `invalid
# type: string "trusted", expected struct ProjectTrustEntry`; `{"trusted":true}` is `missing
# field 'decision'`; a bad decision is `unknown variant 'bogus', expected 'trusted' or
# 'untrusted'`; a wrong version is `unsupported trust store schema version 2`; omitting it is
# `missing field 'schema_version'`. Extra keys on an entry are tolerated.
#
# `defaults` AND NOT `managed`, matching packs/claude's `hasTrustDialogAccepted` — the
# honest match for "trust by default". A `defaults` fill never overwrites a key the file
# already holds, so a user who has explicitly UNtrusted the workspace (or edited the store
# themselves) keeps their value.
#
# `stateful`, AND THE MODE IS DELIBERATE RATHER THAN COPIED FROM claude. claude's trust key
# rides on `~/.claude.json`, which is `rmw`; this surface cannot be. `rmw` writes through
# jsonx's `DumpsIndent` over the DECODED manifest value, and a whole number read out of a
# manifest is a `float64`, which that encoder renders `1.0` — and Muse REJECTS a float
# version: `malformed trust store … invalid type: floating point `1.0`, expected u32`,
# exit 1, worse than the dialog. The stateful compose path normalizes the number, so
# `schema_version` lands as `1`. `stateful` is also the right semantics here: Muse OWNS
# this file and rewrites it when trust changes, and a stateful surface captures those
# in-jail edits and folds them above `defaults` instead of losing them.
#
# This file is the ONLY trust persistence — Muse has no trust subcommand,
# `~/.config/muse/settings.json` carries no trust key, and the documented
# `--trust-workspace` flag "does not save trust".
#
# `schema_version` is a `defaults` key for the same reason: Muse refuses to start without it,
# but a version the user's own store already carries (written by a newer Muse) must not be
# overwritten by yolo's 1.
[[config]]
config = [{ agent = "muse", defaults = { projects = { "${workspace}" = { decision = "trusted" } }, schema_version = 1 }, mode = "stateful", name = "trust", path = "~/.config/muse/trust.json" }]

# WHERE USER-LEVEL SKILLS GO. Meta documents the account-wide skills directory as
# `$XDG_CONFIG_HOME/muse/skills` — with the default XDG_CONFIG_HOME that is
# `~/.config/muse/skills` (https://dev.meta.ai/docs/muse-code/extending: "your
# account-wide skills in `$XDG_CONFIG_HOME/muse/skills` and `~/.agents/skills`"). This
# contribution is a DESTINATION and sources nothing (no `from`): it is how every pack's
# skills tree reaches `muse`, the shape the claude/pi/codex packs declare for their own
# agents. `~/.agents/skills`, the second path the same page names, is deliberately NOT
# declared here — it is a cross-tool directory, so declaring it would claim a destination
# this pack does not own rather than muse's own skills dir.
[[skills]]
agent = "muse"
into = ".config/muse/skills"

# WHERE USER-LEVEL INSTRUCTIONS GO — THE BRIEFING DESTINATION. Meta's native
# user-level ("machine-wide") instructions file is `$XDG_CONFIG_HOME/muse/AGENTS.md`,
# i.e. `~/.config/muse/AGENTS.md` with the default XDG_CONFIG_HOME. It loads even in an
# untrusted workspace and, when present, REPLACES (does not merge with) foreign rules;
# when it is ABSENT, Muse falls back to `~/.claude/CLAUDE.md`, else
# `${CODEX_HOME:-$HOME/.codex}/AGENTS.md`, tagged `foreign_personal_fallback`. So the
# destination is the sibling of the skills dir above, under the same `~/.config/muse`
# root the settings surface already writes (and which is already per-workspace durable —
# see the no-`state` note below).
#
# ESTABLISHED EMPIRICALLY, NOT BY STRINGS. Muse Code 1.4.6 was installed and run
# headlessly under a controlled HOME, and the run's own `session.jsonl` plus its
# `rules.context_load` diagnostic named this file, and demonstrated the replacement and
# fallback behaviour above. That is the evidence internal/packload/agentsurfaces_test.go's
# census requires. XDG_CONFIG_HOME is honored when set, in which case this default path
# is NOT read — the same caveat every `~/.config`-based destination in the shipped set
# carries.
[[briefing]]
agent = "muse"
into = ".config/muse/AGENTS.md"

# AUTONOMY — MUSE'S OWN YOLO MODE IN A JAIL, PROMPTS AT THE HOST. The two postures are the
# §4.2 notch pair — the confinement notch's AgentAutonomy bit selects `autonomous` at
# jail/guest/preview and `guarded` at the host (render.ProfileFor).
#
# THE AUTONOMOUS FLAG IS `--yolo`, Muse's documented equivalent of yolo's own mode. Muse Code
# 1.4.14's `muse --help`: "--yolo  Disable approval and sandbox, trust this workspace, enable
# async questions (this run)". It is the whole posture in one switch, where the earlier
# `--disable-approval --disable-sandbox` pair was only two of its four axes: it left trust to
# the store above and async questions off. Trust on the RUN matters because Muse keys trust
# by the exact launch directory (`muse: workspace root: <cwd> (cwd default)`; a trusted
# parent does not cover a child — measured), so the store's `/workspace` entry clears the
# dialog only for a `muse` started AT /workspace, and `--yolo` clears it from any directory.
# The store stays: it is what trusts every entry point that does not carry the flag
# (`muse exec`, below, and whatever an agent spawns). Measured: `muse --yolo resume --last`
# gets past the trust gate that `muse resume --last` stops at ("workspace trust … is
# undecided").
#
# THE FLAGS SKIP MUSE'S SUBCOMMANDS, and without that every one of them was broken in a jail.
# Muse reads root options only in front of its interactive TUI: measured against 1.4.14,
# `muse --yolo exec …` (and the old pair) exits 2 with `invalid TUI options: unknown argument
# 'exec'`, and `muse --yolo skills list` prints the root help and exits 2 — so the launcher's
# unconditional prefix broke `muse exec` and the other subcommands, the muse-planner pack's
# wrapper (which runs `muse exec`) and a Muse built-in skill that probes `muse exec --help`. `subcommands` names every subcommand
# `muse --help` lists EXCEPT `resume`, whose help says root options "may appear on either
# side of `resume`" and which is an interactive session that should get the posture; a
# launch whose argv[1] is a listed word gets no flags (packdecl AutonomyLaunch.Subcommands).
# A new Muse subcommand missing from the list fails the same loud way, and is added here.
#
# THE GUARDED POSTURE IS A FLAG, because Muse has NO settings key for approval or sandbox:
# `approval`, `approval_mode`, `sandbox` and `yolo` are each refused (`-c approval_mode:
# refusing run: unknown key: no such setting`, measured), and the one posture-shaped
# settings key — `permissions.default_profile` — is the key this pack's settings comment
# forbids putting in `managed`. So the guarded posture asserts `--approval-mode on-request`,
# the documented "ask before tool calls" mode, which is a real assertion rather than the
# autonomous flag's absence restated: it pins prompts ON at the host regardless of any
# `permissions.default_profile` the user has set. It skips the same subcommands for the same
# reason. claude, codex and pi carry config keys in `guarded` because their autonomous
# postures write PERSISTENT keys; a launch flag has no persistence (it is composed per
# launch), so a flag is the whole of this posture — copilot's flag-only `--yolo` is the same
# shape, and it declares no guarded posture because it has nothing persistent to undo.
#
# The rows are spelled as tables rather than the one-line inline form other packs use,
# because an inline table may not span lines and the subcommand list does not fit on one.
[[autonomy]]
replace = true

[[autonomy.autonomous.launch]]
bin = "muse"
flags = ["--yolo"]
subcommands = ["auth", "config", "exec", "export", "init", "login", "logout", "mcp", "model-profile", "plugins", "sandbox", "schema", "serve", "session-message", "skills", "trace", "usage", "voice"]

[[autonomy.guarded.launch]]
bin = "muse"
flags = ["--approval-mode", "on-request"]
subcommands = ["auth", "config", "exec", "export", "init", "login", "logout", "mcp", "model-profile", "plugins", "sandbox", "schema", "serve", "session-message", "skills", "trace", "usage", "voice"]

# THE LOGIN IS SHARED ACROSS WORKSPACES BY A TOP-LEVEL MACHINE-SCOPE DIR AND A FILE-LEVEL
# HOOK, NOT BY A `state` AT `.config/muse`, AND THE DISTINCTION IS THE WHOLE POINT.
#
# Muse Code keeps its login at `~/.config/muse/auth.json`, and that login must survive from
# one jail to the next. `~/.config` is per-workspace durable on every backend: podman binds
# `<wsState>/config` there (`podmanEarlyHomeBinds`, which is also what the persistence map
# reads), Apple Container binds the whole home, and macos-user's layout links `.config` into
# the workspace sidecar (`DeriveDarwinHomeLayout`). So `auth.json` persists across launches
# of ONE workspace with no declaration — and logging in inside one jail does nothing for any
# other, which is the defect this pair fixes. The maintainer is on a Muse SUBSCRIPTION and
# cannot mint a Model API key, so the environment-variable route is not available: the
# credential has to come from the CLI's own login flow, which is exactly what the
# `shared_credentials` hook carries into the machine tier (the shape claude and agy already
# use).
#
# A `state` CONTRIBUTION AT `.config/muse` IS STILL REFUSED, and the reason is the NESTED
# path rather than sharing itself. The darwin layout links `.config` WHOLESALE, so a second
# link at the nested `.config/muse` cannot be laid — `ensureLayoutSymlink` finds the real
# directory the same layout just created and `Apply` returns an occupied-layout refusal, so
# every macos-user launch selecting this pack FAILED at boot with `darwin_home_layout: … a
# real path where the workspace tier's symlink belongs: <home>/.config/muse` (reproduced by
# internal/entrypoint/darwinoverlaystate_test.go's pack enumeration, which is what caught
# it). Muse Code is the only shipped agent whose config lives under `.config`, so it is the
# only one a nested state dir would affect — every other agent pack's state dir is a
# top-level dot-dir (`.claude`, `.codex`, `.pi`, `.oh-omp`, `.gemini`) with no linked
# ancestor. The hook below links a FILE under the home root, into a machine-scope dir that
# is also at the root, so it never claims a path inside a linked ancestor and never collides
# with the wholesale `.config` link.
[[state]]
at = ".muse-shared-credentials"
because = "identity/credential state shared across workspaces"
scope = "machine"

[[hook]]
at = ".muse-shared-credentials"
from = ".config/muse/auth.json"
hook = "shared_credentials"
