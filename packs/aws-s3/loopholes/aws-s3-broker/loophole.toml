# The aws-s3 broker: a CLI-front call broker. Core runs the host `aws` program with the
# canonical argv the classifier produced, using the host's own AWS login (HOME plus the
# declared env_from_host); nothing of that login is shown to the jail or the classifier.
# It does NOT change aws-auth's credential route: an aws-auth credential with S3 reach
# bypasses this broker, which is the user's narrowing to control.
name = "aws-s3-broker"
description = "Run scoped S3 commands on the host with the host's AWS login."
version = 1
access = "read S3 objects and listings under this workspace's declared roots; writes ask first"
transport = "loopback-tls"
lifecycle = "spawned"

[[grants]]
kind = "read"
text = "read S3 objects and listings under the declared roots"
requestable_by_default = true

[call_broker]
source = "aws-s3"
front = "cli"
program = "aws"
classifier = ["yolo", "internal", "call-broker-classify", "aws-s3"]
executor = "core"
credential_paths = ["~/.aws"]
env_from_host = [
  "AWS_PROFILE", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_CONFIG_FILE",
  "AWS_SHARED_CREDENTIALS_FILE", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY",
  "AWS_SESSION_TOKEN", "AWS_ENDPOINT_URL", "AWS_ENDPOINT_URL_S3",
]

# Roots are declared per workspace (`brokered.aws-s3.roots`): `s3://<bucket>` or
# `s3://<bucket>/<prefix>/`.
[call_broker.scope]
roots = "declared"

[[call_broker.resource]]
type = "location"

[[call_broker.resource]]
type = "prefix"
parent = "location"

[[call_broker.resource]]
type = "object"
parent = "location"

# Writes always ask: there is no default answer for either cell.
[[call_broker.cell]]
name = "put_objects"
tables = ["working_set", "all"]
max_for = "1h"

# No max_for: core caps a timed answer to a delete at its 15-minute default.
[[call_broker.cell]]
name = "delete_objects"
tables = ["all"]
