# The `git-broker` loophole, shipped by the OFFICIAL `git` pack: a host daemon that connects to
# one jail's approved git remotes the way the host does, on its behalf
# (docs/reference/git-broker.md, docs/reference/git-broker.md). The daemon is
# internal/gitbroker, reached from the jail through git's own remote-helper protocol: the
# pack's `env` contribution rewrites ssh://, git+ssh://, ssh+git://, https:// and git@ remotes
# (including scp-style bracketed IPv6 forms) to `yolo::<url>`, so the
# jail's real git runs `git-remote-yolo`, which the pack's `intercept` forwards to
# `yolo git-remote --` (ID-4).
#
# THE CREDENTIAL NEVER CROSSES; THE PROTOCOL DOES. The jail sends a service and the remote URL;
# the broker checks the URL against the scope the launch approved, connects to the approved
# string with the host's ssh, streams a fetch back, and reads a push's ref commands before
# forwarding anything. A push lands only where a grant or the working set covers every ref
# (ID-9: creating a branch under a create-branch grant, then updating or deleting a branch the
# broker created or a branch grant in the workspace config declares, GB-D12, and a tag a tag grant
# names, GB-D25); every
# other push asks the host user for an Allow once (GB-D16) and is refused per ref until
# allowed, and every call is audited.
name = "git-broker"
description = "Run the jail's git fetch and push through the host's own credentials (its SSH keys or agent for SSH remotes, its git credential helper for HTTPS ones), only using those credentials against this workspace's approved git remotes and read grant (brokered.git.grants). A public HTTPS fetch is tried anonymously even without a grant or approved remote. A push lands only on a branch a create-branch grant lets it create or one in its working set (a branch it created that way, or one a branch grant in the workspace config declares, by name or pattern; yolo approve lists them), or on a tag a tag grant in the workspace config names; every other push of branches or tags files a request the host user answers with yolo approve <id> (Allow once, for that exact push run again within 15 minutes) and is refused per ref until then, and every call is audited on the host (yolo audit --service git)."
version = 1
# No switch, and no access by default (boundary-broker.md BB-D104 to BB-D106, git-broker.md
# GB-D15). A `brokered` loophole runs whenever its pack is selected, so selecting the pack
# starts the broker and serves the remote rewrite (ID-6) in every workspace, and the broker
# grants no credential access by default: every push and every SSH fetch is refused until a
# read grant covers the remote. A public HTTPS fetch is tried anonymously even without that
# grant or an approved URL. The usual read grant is `{ kind = "read", repo = "*" }` under
# `brokered.git.grants` in the user config, which each workspace's config-change prompt or
# `yolo config apply` shows and a human approves.
transport = "loopback-tls"
lifecycle = "spawned"
# `yolo check` asks the daemon which host ssh and git it would run.
doctor_cmd = ["yolo", "internal", "daemon", "git-broker", "--self-check"]

# THE REPOSITORY SCOPE (loopholedecl/brokered.go, ID-2). `remote_host: "*"` makes core read
# every remote of the workspace, on any host, `url` and `pushurl` alike, and put each URL in
# the config-change prompt verbatim; the scope file records what a human approved with
# `"form": "remote-url"`, and the broker connects only to an approved string. The credential
# paths are where the host keeps what git authenticates with; with this pack selected, a
# workspace `mounts` entry reaching one is refused (BB-D26, ID-12).
[brokered]
source = "git"
remote_host = "*"
# The grant kinds this source defines beside `read`, which every source defines (ID-10,
# BB-D107): a workspace grant of one, allowed by the user config's `brokered.git.grant_kinds`,
# lets the broker create branches under refs/heads/ in the granted repository
# (`create-branch`, ID-9), puts the branch it names, or every branch its pattern matches, in
# the workspace's working set, declared in config (`branch`, git-broker.md GB-D12, GB-D13,
# GB-D25), or lets the broker push the tags it names or matches (`tag`, GB-D25).
grants = ["create-branch", "branch", "tag"]
read_capability = "fetch"
kind_capabilities = { create-branch = "new_branches", branch = "push", tag = "push_tags" }
pending_capabilities = []
credential_paths = ["~/.ssh", "$SSH_AUTH_SOCK", "~/.git-credentials", "~/.config/git/credentials"]

# One daemon per jail, behind yolo's front, with the connection preamble on: every audit line
# keys on the preamble's host-asserted jail id, never on a request field (BB-D1).
[host_daemon]
cmd = ["yolo", "internal", "daemon", "git-broker", "--socket", "{socket}", "--scope-file", "{repository_scope}"]
publishes = "socket"
