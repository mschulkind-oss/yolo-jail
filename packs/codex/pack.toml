model_list_check = { codex = { rules = [{ platform = "aws-bedrock", makers = ["openai"] }] } }
name = "codex"
mcp_remote_transports = ["http"]
# CODEX BRINGS ITS OWN PROVIDER (docs/design/provider-enablement.md OQ-PE2): packs/codex-auth
# declares the `openai-codex` provider and the `codex` profile and runs the openai-auth-broker,
# so every Codex launch has the broker that keeps its single-use refresh token from being burnt
# by a second jail, and the env above gated on it is served.
needs = [{ pack = "codex-auth" }]

[[mcp_auth]]
store = ".codex/.credentials.json"
format = "json"
entries_at = []
companions = []
empty_store = "delete"
lock = { protocol = "flock", path = ".codex/mcp-oauth-locks/file-store.lock" }
fields = { access_token = "access_token", refresh_token = "refresh_token", expires_at = { path = "expires_at", unit = "ms" }, client_id = "client_id" }
rereads_before_refresh = true
login_hint = "codex mcp login {name}"

# Where each install hint's name came from, one line per manager, checked 2026-10-02.
#   brew-cask: https://formulae.brew.sh/api/cask/codex.json (binary artifact bin/codex, linked as `codex`; there is no codex formula)
#   pacman: https://archlinux.org/packages/extra/x86_64/openai-codex/files/ (usr/bin/codex)
[[program]]
bin = "codex"
install = { default = false, brew-cask = "codex", pacman = "openai-codex" }
# Codex's native provider map in both checked public tags (read 2026-10-09):
# https://github.com/openai/codex/blob/rust-v0.158.0/codex-rs/model-provider-info/src/lib.rs#L643-L675
# https://github.com/openai/codex/blob/rust-v0.159.2/codex-rs/model-provider-info/src/lib.rs#L651-L683
# The map is built by `built_in_model_providers`; `responses` is a WireApi value, not a key.
# This is a verified source baseline, not a claim about the latest published Codex release.
built_in_providers.names = [
  "openai",
  "amazon-bedrock",
  "amazon-bedrock-runtime",
  "ollama",
  "lmstudio",
]
built_in_providers.plans = { openai-codex = { provider = "openai" } }
built_in_providers.yolo_lists = ["openai-codex"]
# How `yolo host -p <profile> -- codex` moves codex for one launch without touching
# ~/.codex/config.toml (docs/design/model-lists-and-pickers.md MM-D30): the config derive's
# selection and the provider row it names, each as `-c <dotted key>=<TOML value>`, which
# codex applies over its config file (MEASURED on codex 0.145.0). The subscription's
# selection names no model_provider, which a jail's render clears; here `openai`, codex's
# built-in subscription provider, stands for that clear (MEASURED: it loads with no row).
launch_selection.defaults = { model_provider = "openai" }
launch_selection.each = ["-c", "{key}={value}"]
launch_selection.rows = { named_by = ["model_provider"], table = "model_providers" }
launch_selection.surface = ".codex/config.toml"
model_menu.catalog = ["debug", "models", "--bundled"]
model_menu.clear = ["upgrade", "availability_nux"]
model_menu.entries = "models"
model_menu.flag = ["-c", "model_catalog_json={into}"]
model_menu.id = "slug"
model_menu.into = ".codex/yolo-model-menu.json"
model_menu.list = ".codex/yolo-model-list.json"
model_menu.name = "display_name"
model_menu.order = "priority"
model_menu.set = { visibility = "list" }
# A version probe answers at once (pi-extension-store-builds.md XB-D24, XB-D51): the
# word the per-pack install matrix runs (integration/agents_test.go). It skips the model
# menu, which runs codex once more to print its catalog.
probe_args = ["--version"]
protocols = ["openai-responses", "openai"]
unlisted_background_models = true
update = ["update"]
url = "https://chatgpt.com/codex/install.sh"
versions_dir = ".codex/packages/standalone/releases"
via = "installer"

[[briefing]]
after = "host:.codex/AGENTS.md"
agent = "codex"
into = ".codex/AGENTS.md"

[[skills]]
agent = "codex"
into = ".codex/skills"
project_dirs = [".codex/skills", ".agents/skills"]

[[config]]
config = [
  { agent = "codex", managed = { projects = { "${workspace}" = { trust_level = "trusted" } } }, unset = ["/tui/model_availability_nux"], name = "config", path = "~/.codex/config.toml", retireOnFirstRender = ["yolo-managed-mcp-servers.json"] },
  { agent = "codex", mode = "computed", name = "model-list", notAtHost = "`yolo host -- codex` composes this list for its own launch, in-process, and builds codex's model menu from it without the file, so at the host the file would name models nothing reads", path = "~/.codex/yolo-model-list.json" },
]

[[env]]
vars.CODEX_NON_INTERACTIVE = "1"
vars.YOLO_AUTH_PRELAUNCH_CODEX_FLAG = "--codex-auth"
vars.YOLO_AUTH_PRELAUNCH_CODEX_PATH = ".codex/auth.json"

[[env]]
served_by = "openai-auth-broker"
vars = { CODEX_REFRESH_TOKEN_URL_OVERRIDE = "http://{listen}/oauth/token" }

[[autonomy]]
autonomous.config = [{ agent = "codex", managed = { approval_policy = "never", features = { daemon_auto_start = false }, sandbox_mode = "danger-full-access" }, name = "config", path = "~/.codex/config.toml" }]
autonomous.launch = [{ bin = "codex", flags = ["--dangerously-bypass-approvals-and-sandbox"] }]
guarded.config = [{ agent = "codex", managed = { approval_policy = "on-request", sandbox_mode = "workspace-write" }, name = "config", path = "~/.codex/config.toml" }]
replace = true

[[state]]
at = ".codex"
