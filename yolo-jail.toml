# YOLO Jail workspace config for the yolo-jail repo itself.
#
# Committed so every clone shares the same packages and requests. Every key, with examples:
# `yolo config-ref`. Change it with `yolo config set|add|unset`, or by hand, then run
# `yolo check`. Packs (agents included) are chosen in your user config, not here.

[install]
# `just` is not in the image's core packages, and this repo's recipes (test, lint, deploy)
# run through it.
nix = ["just"]

[install.mise]
# lua/luac, so the packs' derive.lua files can be syntax-checked in a bare shell.
lua = "5.4.9"

[requests.git]
# The git broker may push to this repository's main (a working-set branch, see
# userguide/guides/git.md). Takes effect only once your user config allows the "branch"
# grant kind and the request is approved at the config-change prompt or `yolo config apply`.
push = ["main"]

[requests.github]
dispatch_workflows = ["release-request.yml", "nightly-macos.yml", "macos-user.yml", "apple-container.yml"]
approve_runs = ["github-actions[bot]"]
