name = "aws-broker"
description = "Run scoped S3 commands and read-only Cost Explorer queries with the host AWS login; financial data is sensitive and AWS requests may be billable. Declared host env values are redacted from output, which can alter returned data."
version = 1
access = "read S3 and sensitive Cost Explorer data under declared service roots; AWS requests may be billable; S3 writes ask first"
transport = "loopback-tls"
lifecycle = "spawned"

[[grants]]
kind = "read"
text = "read S3 objects/listings and sensitive Cost Explorer financial data under declared service roots; AWS requests may be billable"
requestable_by_default = true

[call_broker]
source = "aws"
front = "cli"
program = "aws"
classifier = ["yolo", "internal", "call-broker-classify", "aws"]
executor = "core"
credential_paths = ["~/.aws"]
env_from_host = [
  "AWS_PROFILE", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_CONFIG_FILE",
  "AWS_SHARED_CREDENTIALS_FILE", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY",
  "AWS_SESSION_TOKEN", "AWS_ENDPOINT_URL", "AWS_ENDPOINT_URL_S3",
]

[call_broker.scope]
roots = "declared"

[[call_broker.resource]]
type = "location"

[[call_broker.resource]]
type = "prefix"
parent = "location"

[[call_broker.resource]]
type = "object"
parent = "location"

[[call_broker.resource]]
type = "cost_query"
parent = "location"

[[call_broker.cell]]
name = "put_objects"
tables = ["working_set", "all"]
max_for = "1h"

[[call_broker.cell]]
name = "delete_objects"
tables = ["all"]
