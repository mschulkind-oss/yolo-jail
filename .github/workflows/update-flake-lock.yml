name: Update flake.lock

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.  The jail image's entire toolchain
    # (mise, node, python, go, …) rides flake.lock — see
    # docs/design/jail-version-predictability.md for why this must not drift.
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

# Opt every JavaScript action into Node.js 24 ahead of GitHub's
# 2026-06-02 default switch.  ``actions/upload-artifact@v5`` still
# bundles Node 20 in its ``action.yml`` (no v6 with Node 24 yet);
# this env var overrides that for the whole workflow without
# pinning to a beta tag, and silences the runtime deprecation
# annotation we'd otherwise get on every CI run.  Removable once
# every pinned action ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    # Deviation from the repo's read-only default (ci.yml sets
    # `permissions: contents: read` workflow-wide): this job pushes a
    # branch with the refreshed flake.lock and opens a PR for it, which
    # requires write access — scoped to this job only.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The pre-update lock is one half of the closure diff below, and it has
      # to be captured BEFORE the action rewrites it.  It goes to RUNNER_TEMP,
      # never the working tree: the `create-pull-request` action inside
      # update-flake-lock commits every new or modified file it finds there
      # (which is why update-flake-lock itself deletes its own pr_body.txt).
      - name: Capture the pre-update flake.lock
        run: cp flake.lock "$RUNNER_TEMP/flake.lock.before"

      # flake.nix/flake.lock live at the repo root (src/flake.* are
      # symlinks to them), so no working directory override is needed.
      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(deps): weekly flake.lock bump"
          pr-body: |
            Automated weekly `flake.lock` refresh.

            The jail image's toolchain (mise, node, python, go, …) rides
            this lock — see docs/design/jail-version-predictability.md. Merging
            picks up current nixpkgs on the next image rebuild
            (`just load && just install` on the host).
          pr-labels: |
            dependencies
            automated

      # What the three-line lock diff cannot say: which of the ~40 packages
      # this image bakes actually moved.  This step builds `.#imageClosureRoot`
      # on both locks and appends `nix store diff-closures` to the PR body —
      # "go 1.26.4 → 1.26.5, chromium 150 → 151, +40.8 MiB".
      #
      # It runs AFTER the PR exists so that it can only ever ADD to the bump,
      # never block it: `continue-on-error` plus a script that degrades to a
      # note means the worst case is the body the action already wrote.  Both
      # sides are pure substitution from cache.nixos.org (~900 MiB cold, then
      # only the delta for the second side), because the root deliberately
      # excludes our own Go build — see the comment on `imageClosureRoot` in
      # flake.nix.  No new permissions: `pull-requests: write` above is what
      # `gh pr edit` needs, and the job already had it to open the PR.
      - name: Add the image closure diff to the PR body
        if: steps.update.outputs.pull-request-number != ''
        continue-on-error: true
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
          BEFORE_LOCK: ${{ runner.temp }}/flake.lock.before
        run: .github/scripts/flake-lock-closure-diff.sh
