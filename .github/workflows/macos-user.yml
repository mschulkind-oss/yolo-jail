name: macos-user backend

# THE macOS JOB THAT NEEDS NO IMAGE — which is the whole reason it is a workflow of
# its own rather than a second job in `nightly-macos.yml`.
#
# A macos-user launch returns before `runContainer`: it never calls `AutoLoadImage`,
# never loads an OCI image, and builds its tools with NATIVE darwin nix from this
# flake instead (`internal/cli/run/run.go`, the arm that refuses a launch with no repo
# root — "the macos-user backend builds its tools from the yolo-jail flake with native
# nix … so it needs the flake even when you declare nothing"). So none of the
# four-link chain that has kept `nightly-macos.yml` red since 2026-09-09 applies here:
# no Linux-built image to vouch for, no forced rebuild, no absent Linux builder, no
# harness refusal (docs/reference/image-staging-vs-baking.md — the identity warning under
# "Invariants", and "A failed build is fatal").
#
# THAT IMMUNITY IS ONLY VISIBLE IF IT HAS ITS OWN VERDICT. Inside the nightly this job
# would sit beside a job that is red for reasons it does not share, under one workflow
# name and one notification — and "is macOS OK?" is a question people answer by looking
# at the workflow, not by expanding it. A separate workflow is the difference between
# a green signal and a green job nobody sees.
#
# Two more things a separate file buys, both consequences of needing no image: it can
# be dispatched alone without also triggering an image build and four 50-minute shards,
# and it is the one macOS instrument that can keep reporting while the image chain is
# being fixed.

on:
  # Nightly, an hour after `nightly-macos.yml`, so the two runs are adjacent in the
  # log without contending for macOS runners at the same minute.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# DELIBERATELY NOT ON push/pull_request, and this is a cost decision rather than a
# policy one: nobody has measured what a first macos-user launch costs.
# docs/reference/macos-user-provisioning.md ("The one unmeasured claim — what a first
# stage costs") says so outright and names this job, and the suite's own
# 30-minute per-launch deadline is documented as a ceiling on waste rather than an
# estimate. Wiring this to every PR touching `internal/macosuser/` commits every such
# PR to an unmeasured wait. The first green run IS the measurement; a `paths:` filter
# is the obvious next step once there is a duration to size it against.

permissions:
  contents: read

# See ci.yml for the full rationale (pinned JS actions that still bundle Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos-user:
    # macos-latest, and BOTH halves of that are deliberate.
    #
    # NOT `macos-26-intel`: that label exists in `nightly-macos.yml` because Podman
    # Machine needs nested virtualization, which GitHub's Apple Silicon runners cannot
    # do. This backend starts no VM and no container, so the constraint does not reach
    # it — and arm64 is the architecture macos-user is actually used on (the only
    # hardware session this backend has ever had, 2026-09-10, was an Apple Silicon Mac
    # running macOS 26.5).
    #
    # NOT PINNED, on purpose. `sandbox-exec` is Apple-deprecated and the confinement
    # this suite measures is the kernel's, not ours; a floating label is the only
    # early warning we get when a macOS release changes what the profile does. Pinning
    # would hide exactly the class of breakage this job exists to catch. The runner
    # facts step below records which OS a given run actually measured.
    runs-on: macos-latest
    name: macos-user (native darwin, no image)
    # A CEILING ON WASTE, not an estimate — the same stance as the suite's per-launch
    # deadline. Sized so that ONE launch hitting its 30-minute deadline still leaves room
    # for the remaining tests to report their own diagnoses, because a cap that fires
    # first replaces every result with none. The green-path cost is measured now, and is
    # far below this: in scheduled run 36134719833 (2026-09-25) the integration step took
    # under 2.5 minutes and the job under 4. So this is the wedge budget, not the normal
    # one. Revise it against the duration green runs report, never against a guess. The
    # inner dial is YOLO_TEST_MACOS_USER_TIMEOUT (seconds, per launch). The 60 above the
    # former 120 is exactly the ceiling of "Build the macOS floor", a step this budget did
    # not hold before; no test's own budget moved.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI under test is built by the harness with a plain `go build`, so it
          # carries no version stamp and reports a LIVE `git describe` of this
          # checkout instead (internal/version). Depth 1 has no tags to describe.
          fetch-depth: 0

      # Every macos-user launch materializes a darwin profile with `nix build` — the
      # FLOOR (`darwinpkg.FloorNames()`: bash, git, mise, node, ripgrep, jq, … ) before
      # the workspace declares anything. No nix, no floor, no launch.
      #
      # Nothing to configure beyond the experimental features: the launch's own argv
      # already carries `--accept-flake-config` (`darwinpkg.nixFlags`), so the flake's
      # substituter is honored without this step restating it. That substituter,
      # yolo-jail.cachix.org, serves the Linux image closures (`publish.yml`,
      # `nightly-macos.yml`) and the darwin floor profile, which `darwin-floor-cache.yml`
      # builds and pushes from macOS runners whenever flake.nix or flake.lock changes on
      # main. The rest of the floor comes from cache.nixos.org. The one floor entry
      # neither public cache can serve is the rustls mise (flake.nix,
      # `noncontainerFloorSubstitutes`): about 27 minutes cold on an M-series Mac. Before
      # that push has happened for a commit, it compiles here, in "Build the macOS floor"
      # below and never inside a test's budget.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For correlating a future break with an OS bump, since the runner label floats.
      # INFORMATIONAL ONLY — deliberately not a precondition check: the gate in
      # integration/macosusergate_test.go is the one authority on what this backend
      # needs, and restating its conditions here would be a second copy of them in a
      # language with no test coverage.
      - name: Runner facts
        run: |
          sw_vers
          uname -m
          sudo -n true && echo "sudo -n: passwordless" || echo "sudo -n: WOULD PROMPT"

      # Q3 (docs/design/macos-user-build-step-threat-model.md): WHICH PARTS OF THE macOS FLOOR
      # ASSUME AN UNSANDBOXED DARWIN BUILD? A MEASUREMENT, and it can never fail this job.
      #
      # WHAT IT BUILDS is what every macos-user launch realizes before the workspace declares
      # anything: `.#packages.<system>.yoloNoncontainerProfile` with YOLO_EXTRA_PACKAGES unset,
      # i.e. the floor alone (darwinpkg.BuildFloorProfileArgv). The attribute name is VERIFIED
      # three ways rather than trusted: it is `darwinpkg.FloorProfileAttr` in Go, flake.nix
      # binds `packages.yoloNoncontainerProfile` (internal/darwinpkg/floor_drift_test.go fails
      # if that binding goes), integration/macosusersandboxstep_test.go fails if this step stops
      # naming the Go constant's value, and the step itself evaluates `<attr>.name` before it
      # builds, so a renamed attr is a named error here rather than an empty "nothing failed".
      #
      # WHY IT RUNS FIRST. Only a derivation this runner BUILDS says anything about the
      # sandbox; a path substituted from a binary cache was built elsewhere. "Build the macOS
      # floor" below realizes this same floor unsandboxed, so after it there would be nothing
      # left to build. A derivation that fails here is simply built again, unsandboxed, there.
      #
      # `continue-on-error` because the answer is a LIST, and a failure is part of the list.
      # `--keep-going` so one refusal does not hide the rest. `timeout-minutes` is a ceiling on
      # waste inside the job's own: it is the floor build the step below would otherwise pay,
      # not an extra one, except for whatever the sandbox refuses.
      #
      # ⚠ `--option sandbox true` IS A RESTRICTED SETTING: the daemon honors it only from a
      # trusted user and otherwise ignores it with a warning. The step greps for that warning
      # and says VOID rather than reporting an unsandboxed build as a clean result.
      - name: Q3 — build the macOS floor with the nix build sandbox ON (measurement only)
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -uo pipefail
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          attr=".#packages.${sys}.yoloNoncontainerProfile"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "Q3: attr=${attr}"
          grep -E '^(trusted-users|sandbox|build-users-group)' /etc/nix/nix.conf || true
          if ! name="$(env -u YOLO_EXTRA_PACKAGES nix eval --impure --accept-flake-config --raw "${attr}.name" 2>&1)"; then
            echo "::error::Q3: ${attr} does not evaluate, so nothing was measured: ${name}"
            exit 1
          fi
          echo "Q3: ${attr}.name = ${name}"
          rc=0
          env -u YOLO_EXTRA_PACKAGES nix build --impure --accept-flake-config \
            --option sandbox true --keep-going --no-link --print-out-paths \
            "${attr}" > /tmp/q3.out 2> /tmp/q3.err || rc=$?
          tail -n 80 /tmp/q3.err
          # Each list is captured before it is printed, so an empty one says so instead of
          # printing nothing (grep exits 1 on no match; `|| true` keeps that from being a fault).
          built="$(grep -m1 -oE '(these [0-9]+ derivations|this derivation) will be built' /tmp/q3.err || true)"
          failed="$(grep -oE "(builder for|Cannot build) '/nix/store/[^']+[.]drv'" /tmp/q3.err | grep -oE "/nix/store/[^']+" | sort -u || true)"
          refused="$(grep -E "not allowed when 'sandbox'" /tmp/q3.err | sort -u || true)"
          {
            echo "### Q3: the macOS floor built with \`--option sandbox true\` (measurement only)"
            echo ""
            echo "- attr: \`${attr}\` (\`${name}\`), nix build rc=${rc}"
            if grep -q "ignoring the client-specified setting 'sandbox'" /tmp/q3.err; then
              echo "- ⚠ **VOID**: the daemon ignored \`sandbox\` (a restricted setting, and this user is not trusted), so this build ran UNSANDBOXED and says nothing about Q3."
            fi
            echo "- built here: ${built:-nothing — every path was substituted, so nothing was sandboxed and this run answers nothing}"
            echo "- builds that failed under the sandbox:"
            if [ -n "$failed" ]; then printf '  - `%s`\n' $failed; else echo "  - none"; fi
            echo "- derivations the sandbox policy refused outright (e.g. \`__noChroot\`):"
            if [ -n "$refused" ]; then printf '%s\n' "$refused" | sed 's/^/  - /'; else echo "  - none"; fi
            echo ""
          } | tee -a "$summary"
          exit "$rc"

      # Q3, THE CACHE-MISS HALF (docs/design/macos-user-build-step-threat-model.md#Q3). ALSO A
      # MEASUREMENT, and it can never fail this job either.
      #
      # THE STEP ABOVE HAS NEVER BUILT A FLOOR PACKAGE. Every run so far substituted every path
      # from cache.nixos.org and built only the profile's buildEnv, so it cannot say whether a
      # package's own builder works under the sandbox. This step makes one do so: `nix build
      # --rebuild` builds an ALREADY-VALID derivation again, here, and compares the result with
      # the copy it has. Its inputs stay substituted, so the one package's builder is the only
      # thing that runs, under `--option sandbox true`.
      #
      # THE PACKAGE is jq: a floor entry (darwinpkg.FloorNames();
      # integration/macosusersandboxstep_test.go fails if the name below stops being one), small,
      # and a real compile (a C build against oniguruma) rather than a wrapper. It is spelled
      # `nixpkgs#jq` with `--inputs-from .`, i.e. against THIS flake's locked `nixpkgs` input,
      # which is the package set the floor reads on aarch64-darwin (flake.nix: hostNixpkgs). On
      # any other system the floor reads a different input, so the step says VOID instead of
      # measuring a package no launch here uses.
      #
      # `^*`, because --rebuild checks EVERY output of the derivation and refuses when one is not
      # valid yet, so the first build realizes them all. A "may not be deterministic" error is a
      # build that RAN and finished under the sandbox with output differing from the cache's,
      # which is a reproducibility fact rather than a sandbox refusal, and the summary says so.
      - name: Q3 — rebuild one floor package from source with the nix build sandbox ON (measurement only)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -uo pipefail
          pkg=jq
          inst="nixpkgs#${pkg}^*"
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "### Q3 (cache miss): \`${pkg}\` rebuilt from source with \`--option sandbox true\` (measurement only)" | tee -a "$summary"
          echo "" | tee -a "$summary"
          if [ "$sys" != "aarch64-darwin" ]; then
            echo "- ⚠ **VOID** on ${sys}: the floor reads this flake's \`nixpkgs\` input only on aarch64-darwin, so this would rebuild a package no launch here uses." | tee -a "$summary"
            exit 0
          fi
          if ! nix build --inputs-from . --accept-flake-config --no-link "$inst" 2> /tmp/q3m-fetch.err; then
            tail -n 40 /tmp/q3m-fetch.err
            echo "- could not realize \`${inst}\` to rebuild it, so nothing was measured." | tee -a "$summary"
            exit 1
          fi
          start=$(date +%s)
          rc=0
          nix build --inputs-from . --accept-flake-config --no-link --rebuild \
            --option sandbox true --keep-going "$inst" 2> /tmp/q3m.err || rc=$?
          took=$(( $(date +%s) - start ))
          tail -n 80 /tmp/q3m.err
          ran="$(grep -oE "(checking outputs of|building) '/nix/store/[^']+[.]drv'" /tmp/q3m.err | sort -u || true)"
          {
            echo "- installable: \`${inst}\` (this flake's locked \`nixpkgs\`), --rebuild rc=${rc}, ${took}s"
            if grep -q "ignoring the client-specified setting 'sandbox'" /tmp/q3m.err; then
              echo "- ⚠ **VOID**: the daemon ignored \`sandbox\` (a restricted setting, and this user is not trusted), so this rebuild ran UNSANDBOXED and says nothing about Q3."
            elif [ -z "$ran" ]; then
              echo "- ⚠ **VOID**: nix printed no build of the derivation, so no builder ran here and this answers nothing."
            elif [ "$rc" -eq 0 ]; then
              echo "- **BUILT under the sandbox**, and the output is identical to the substituted one."
            elif grep -q "may not be deterministic" /tmp/q3m.err; then
              echo "- **BUILT under the sandbox**; the output differs from the substituted one (not reproducible here), which is not a sandbox refusal."
            elif grep -q "not allowed when 'sandbox'" /tmp/q3m.err; then
              echo "- **REFUSED by the sandbox policy**: $(grep -m1 "not allowed when 'sandbox'" /tmp/q3m.err)"
            else
              echo "- **FAILED under the sandbox**: $(grep -m1 -E "(builder for|Cannot build) '/nix/store/[^']+[.]drv'" /tmp/q3m.err || echo "see the log above")"
            fi
            echo "- what ran:"
            if [ -n "$ran" ]; then printf '%s\n' "$ran" | sed 's/^/  - /'; else echo "  - nothing"; fi
            echo ""
          } | tee -a "$summary"
          # A non-reproducible output is an ANSWER (it built), so it does not mark the step failed.
          if [ -n "$ran" ] && grep -q "may not be deterministic" /tmp/q3m.err; then exit 0; fi
          exit "$rc"

      # THE FLOOR, BUILT BEFORE ANY LAUNCH, with its own ceiling. Every macos-user launch
      # realizes `.#packages.<system>.yoloNoncontainerProfile` with YOLO_EXTRA_PACKAGES unset
      # (darwinpkg.BuildFloorProfileArgv), and the first launch used to pay for whatever of
      # it was not in a cache INSIDE its own 30-minute deadline. After a change to mise's
      # derivation that is the rustls mise, about 27 minutes cold on an M-series Mac (lab
      # report 2026-10-24, section 3): the first test timed out, its killed build stored
      # nothing, and the next test started the same build over. warmJail
      # (integration/harness_test.go) returns early on darwin, so nothing else warms it.
      #
      # A PLAIN BUILD, never the Q3 steps above: those are measurements with
      # `continue-on-error` and the sandbox on, and a refusal there must not leave the floor
      # unbuilt. When Q3 already built everything this is a no-op. NOT `continue-on-error`:
      # a floor that does not build fails every launch below, so this step's red is the one
      # place that names the real cause. The ceiling is this step's, not a test's;
      # integration/macosusersandboxstep_test.go pins the step, its attribute and its place.
      - name: Build the macOS floor (before any launch)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          start=$(date +%s)
          env -u YOLO_EXTRA_PACKAGES nix build --impure --accept-flake-config --no-link \
            --print-out-paths ".#packages.${sys}.yoloNoncontainerProfile"
          echo "the floor took $(( $(date +%s) - start ))s to realize" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # The account the whole backend runs as. The suite will NOT create it — a test
      # run must not silently add a system account to somebody's Mac — so it is an
      # explicit step here, where the machine is ephemeral and the mutation is
      # therefore free. Idempotent; creates `_yolojail` (hidden, random password, no
      # login shell), the shared root at /Users/Shared/yolo, the host-owned staging root
      # at /Users/Shared/yolo-staged, and the one sudo rule /etc/sudoers.d/yolo-jail that
      # runs commands as _yolojail, never as root (docs/design/macos-user-privilege-lifecycle-plan.md).
      #
      # NOT under sudo: `macos-setup` refuses to run as root (it would assign the
      # shared-workspace ACL to root), and calls sudo itself for the steps that need
      # it. That is why the `sudo -n` fact above matters — on a runner without
      # passwordless sudo this step hangs instead of failing.
      #
      # `continue-on-error`, ADDED WITH THE POLICY SUITE AND ONLY BECAUSE OF IT. The
      # Seatbelt assertions below need `sandbox-exec` and a writable /Users/Shared and
      # nothing else — no account, no sudo, no nix — so a failed setup no longer makes
      # the whole macOS verdict unobtainable: the run still reports whether the profile
      # denies what it says it denies, which is the one question this job can still
      # answer on a machine whose account setup broke. It does NOT soften the verdict.
      # The vacuity guard is computed PER GATE (integration/macosusergate_test.go),
      # so a run in which every launch test skipped is failed even though the policy
      # tests ran — the step's failure surfaces as a named red below instead of an
      # aborted job with no results.
      - name: Create the sandbox account
        id: account
        continue-on-error: true
        run: go run ./cmd/yolo macos-setup

      # THE /Volumes MEASUREMENT FOR cache_relocations (docs/plans/cache-relocation.md, the
      # macos-user section; CX-D5 and OQ-CX8 in docs/reference/context-mounts.md). A relocation may
      # point at another volume on this backend, which no context mount may, and what decides
      # whether the sandbox account can use one is the volume itself: its ownership setting, and
      # whatever macOS asks of an account touching a removable volume. So two small APFS disk
      # images are attached under /Volumes, one with ownership ON and one with it OFF, and named
      # to the suite in YOLO_TEST_MACOS_USER_RELOCATION_VOLUMES (colon-separated). Two tests read
      # it and RECORD what they find, asserting only their controls:
      # TestMacosUserSeatbeltRelocationOnAVolumeMeasurement (the profile's re-allow past the
      # /Volumes read deny, as the runner) and TestMacosUserCacheRelocationOnAVolumeMeasurement (a
      # launch writing through the relocation as _yolojail, or refusing before the agent).
      #
      # A THIRD IMAGE IS exFAT, a volume that takes no access entries: the `chmod +a` yolo runs
      # on a target it creates there fails, the launch says so and lets the probes decide
      # (CR-D7), and the measurement records which way they went. Best-effort on its own, so a
      # runner that cannot make one keeps the two APFS measurements.
      #
      # `continue-on-error`: a runner that cannot attach an image loses this measurement and
      # nothing else; the two tests skip, naming the variable, when it is unset. A disk image is
      # not a USB drive or a network share, so neither stands in for the human checks those need
      # (docs/plans/cache-relocation.md, the test plan).
      - name: Attach the volumes for the cache-relocation measurement
        continue-on-error: true
        run: |
          set -euo pipefail
          vols=""
          for mode in owned unowned; do
            name="yolo-reloc-${mode}"
            img="${RUNNER_TEMP}/${name}.dmg"
            hdiutil create -size 64m -fs APFS -volname "$name" -ov "$img"
            hdiutil attach -nobrowse "$img"
            mnt="/Volumes/${name}"
            test -d "$mnt" || { echo "::error::${img} did not mount at ${mnt}"; exit 1; }
            if [ "$mode" = owned ]; then
              sudo -n diskutil enableOwnership "$mnt"
            else
              sudo -n diskutil disableOwnership "$mnt"
            fi
            diskutil info "$mnt" | grep -iE 'mount point|file system personality|owners' || true
            ls -lde "$mnt"
            vols="${vols:+${vols}:}${mnt}"
          done
          exfat="/Volumes/yrexfat"
          if hdiutil create -size 64m -fs ExFAT -volname yrexfat -ov "${RUNNER_TEMP}/yrexfat.dmg" &&
             hdiutil attach -nobrowse "${RUNNER_TEMP}/yrexfat.dmg" && test -d "$exfat"; then
            diskutil info "$exfat" | grep -iE 'mount point|file system personality|owners' || true
            ls -lde "$exfat"
            vols="${vols:+${vols}:}${exfat}"
          else
            echo "::warning::could not attach an exFAT image; the cache-relocation measurement covers the two APFS volumes only"
          fi
          echo "YOLO_TEST_MACOS_USER_RELOCATION_VOLUMES=${vols}" >> "$GITHUB_ENV"

      # THE FILTER IS EXHAUSTIVE BY CONSTRUCTION, not by a list somebody maintains:
      # requireMacosUser FAILS any test behind the gate that is not named
      # TestMacosUser…, so `-run '^TestMacosUser'` cannot miss one. That rule is
      # enforced on Linux, by the ordinary `just check-ci`, so a misnamed test is
      # caught before any Mac is involved.
      #
      # AND A TYPO IN THIS VERY PATTERN FAILS THE JOB. Measured on Linux 2026-09-12:
      # `-run '^TestMacOSUser'` (wrong capitalization) selects zero tests, and the run
      # exits 1 saying "No test even reached the gate: the -run filter selected none of
      # them". That is the guard below doing its job on the one input this YAML file
      # can get wrong.
      #
      # The rest of ./integration is NOT selected, and must not be: every container
      # test needs an image this job deliberately never loads.
      #
      # It does select TestMacosUserPackInstallsVersionsAndConfigures, whose subtests
      # SKIP here and are listed as skipped in the gate's end-of-run report: this step sets no
      # YOLO_TEST_REAL_PACK_INSTALLS, because the `install` job below asks that
      # question, one pack per job. Both halves are pinned on Linux: no job but `install`
      # may set the variable (TestMacosUserPackInstallsWorkflowMirrorsPackMatrix), and
      # without it every subtest skips (TestMacosUserPackInstallsSkipInTheBackendJob).
      #
      # No `-failfast`. Items 6-9 of the runbook are a dependency chain and a human
      # reading the results is told to stop at the first failure — but `go test` orders
      # tests by source position, not by that chain, so failing fast would stop at an
      # arbitrary one and hide the independent items (10a's refusal does not depend on
      # the floor). The whole log costs runner time on a broken day and buys six
      # diagnoses instead of one.
      #
      # TWO GATES ARE BEHIND THAT ONE FILTER, and the difference is worth knowing when
      # reading a result. The LAUNCH gate needs the account the step above creates, the
      # shared root, and the run-as rule that step installs (`/usr/bin/sudo -n
      # --user=_yolojail /usr/bin/env /usr/bin/true` passes); it starts real jails and builds a native nix
      # closure, which is where this job's time goes. The SEATBELT gate
      # (integration/macosuserseatbelt_test.go) needs `sandbox-exec` and a writable
      # /Users/Shared: it writes the profile BuildRunPlan would install, runs commands
      # under it with `sandbox-exec`, and asserts the kernel refused them — every case
      # with a bare control that must succeed, so a refusal is attributed to the policy
      # rather than to a missing file. That is the assertion this job did not have
      # before 2026-09-18: until then 16 tests pinned the profile's TEXT and nothing
      # anywhere asked a kernel whether the text denied anything
      # (docs/research/agent-safehouse.md §8.1).
      - name: macos-user integration tests
        run: go test -count=1 -timeout 0 -v -run '^TestMacosUser' ./integration
        env:
          # THE DECLARATION, and the property this entire suite rests on. Set, a run
          # that executes ZERO macos-user tests EXITS NON-ZERO — because a suite that
          # skips is indistinguishable from a suite that passes, and this backend
          # skips on every machine that develops the repo. Unset (a developer's
          # `just test`, the Linux CI job) the same tests skip quietly, which is
          # correct there. Only the step that scheduled the work can say which it is,
          # which is why the declaration lives here and not in the test binary.
          #
          # So this job goes RED, naming the reason, when `_yolojail` is missing, when
          # sudo would prompt to run as it, when the tests were renamed out of the filter above —
          # every way of arriving at "nothing was exercised". See
          # integration/macosusergate_test.go for the mechanism and its own tests
          # (which run on Linux, under -short, on every push).
          YOLO_TEST_MACOS_USER: "1"
          # DELIBERATELY NO `YOLO_RUNTIME` HERE. The backend is selected PER LAUNCH by
          # the fixture (`macosUserRunEnv`), which is the spelling a job-level variable
          # cannot shadow. Setting it here would instead be read by the harness's
          # `detectRuntime`, which would then look for a container image under a name
          # that is not a container runtime. There is no image step in this job at all:
          # with no runtime on the runner the harness prints one DEGRADED line and
          # carries on, which is the correct outcome for a job that launches no
          # containers.

      # No artifact upload, and nothing to upload: each fixture workspace (and its
      # .yolo/startup.log and launch.log) is removed by the test that made it, so the
      # failing tests attach the stage log to their own failure message instead —
      # `-v` above is what makes that reach the log a reader gets.
      #
      # No teardown either. The runner is ephemeral, and removing the account would
      # delete the evidence any post-mortem step would want to look at.

      # PASSWORDLESS START AND STOP, MEASURED (docs/design/macos-user-privilege-lifecycle-plan.md,
      # task 9). Every step above ran with this runner's blanket passwordless sudo, which would
      # pass a launch that still needed root. These two steps take that away and leave only the
      # rule `yolo macos-setup` installed, then run the launch tests that need nothing more. They
      # are LAST: after the first, no root sudo works on this runner, so nothing after them may
      # need root.
      #
      # WHERE THE BLANKET RULE LIVES, MEASURED (run 38913640055): a hosted macOS runner grants it
      # three times, `%admin ALL = (ALL) NOPASSWD: ALL` in /etc/sudoers itself and
      # `runner`/`anka ALL=(root) NOPASSWD:ALL` in /etc/sudoers.d. So the step does both, as the
      # maintainer approved for this ephemeral runner (2026-10-16): it moves aside every
      # /etc/sudoers.d file carrying a `NOPASSWD: ALL` rule, never yolo's own, and in
      # /etc/sudoers it comments out only the `NOPASSWD: ALL` lines for `%admin` or the runner
      # user. Each `%admin` line it comments out is followed by the stock macOS line
      # `%admin ALL = (ALL) ALL`, so root sudo then asks for a password, as on a normal Mac,
      # rather than refusing outright. The new /etc/sudoers is written beside the old one,
      # checked with `visudo -c -f` BEFORE it replaces anything, and installed with one rename;
      # if the final `visudo -c` still fails, everything is put back. Every NOPASSWD grant is
      # printed before and after, with the diff of /etc/sudoers.
      #
      # ONE sudo INVOCATION does all of it, because its own effect removes the permission it
      # runs under: after the first change no further sudo works, so the edit, the moving, the
      # evidence copies and both `visudo` checks all happen inside one root shell. The moved files are kept under /var/tmp for
      # the log, not deleted.
      #
      # `sudo -k` before each probe: a cached credential would pass `sudo -n` through a broad rule
      # and hide a missing one (the plan's Traps).
      #
      # `!cancelled()`, so a red test in the step above does not also cost this measurement. And
      # only once the account step SUCCEEDED, because the run-as rule this step probes is the one
      # that step installs. Without that condition a failed step before it (the floor build
      # timing out, which skips the account step) made this step fail too, asking whether
      # /etc/sudoers.d/yolo-jail was installed: in every scheduled run from 2026-10-26 to
      # 2026-10-31 that second red read as a sudo defect when nothing had created the account.
      - name: Narrow sudo to the enrolled rule
        id: narrow
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        run: |
          set -uo pipefail
          echo "Every NOPASSWD grant before narrowing:"
          sudo grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d || true
          sudo /usr/bin/env NARROW_USER="$(id -un)" /bin/sh -c '
            set -u
            case "$NARROW_USER" in *[!A-Za-z0-9_-]*|"") echo "unexpected user name: $NARROW_USER"; exit 1;; esac
            aside=/var/tmp/yolo-sudoers-moved-aside
            main=/private/etc/sudoers
            # In /etc, not /etc/sudoers.d (sudo would never read it there anyway, the name
            # holding a dot), and on the same filesystem, so the install is one rename.
            new=/private/etc/.sudoers.yolo-narrowed
            blanket="^[[:space:]]*(%admin|$NARROW_USER)[[:space:]].*NOPASSWD:[[:space:]]*ALL[[:space:]]*$"
            mkdir -p "$aside"

            # 1. Stage and validate the main-file edit before anything changes.
            edit_main=no
            if grep -Eq "$blanket" "$main"; then
              cp -p "$main" "$aside/sudoers.orig"
              awk -v re="$blanket" '"'"'
                $0 ~ re {
                  print "# narrowed by yolo-jail CI: " $0
                  if ($1 == "%admin") print "%admin\t\tALL = (ALL) ALL"
                  next
                }
                { print }
              '"'"' "$main" > "$new" || exit 1
              chown root:wheel "$new" && chmod 0440 "$new" || exit 1
              if ! visudo -c -f "$new"; then
                echo "visudo -c -f rejects the staged /etc/sudoers (or a file it includes); nothing was changed"
                rm -f "$new"
                exit 1
              fi
              edit_main=yes
            else
              echo "/etc/sudoers carries no NOPASSWD: ALL line for %admin or $NARROW_USER"
            fi

            # 2. Move aside the sudoers.d grants, never yolo-jail.
            for f in /etc/sudoers.d/*; do
              [ -f "$f" ] || continue
              [ "$f" = /etc/sudoers.d/yolo-jail ] && continue
              if grep -Eq "NOPASSWD:[[:space:]]*ALL([[:space:]]|$)" "$f"; then
                mv -f "$f" "$aside/" && echo "moved aside: $f -> $aside/"
              fi
            done

            # 3. Install the main file with one rename.
            if [ "$edit_main" = yes ]; then
              mv -f "$new" "$main" || exit 1
              echo "edited /etc/sudoers (original kept at $aside/sudoers.orig):"
              diff "$aside/sudoers.orig" "$main" || true
            fi
            ls -le "$aside"

            # 4. Check the whole configuration; put everything back if it does not parse.
            if ! visudo -c; then
              echo "visudo -c failed after narrowing; restoring the original sudoers"
              for f in "$aside"/*; do
                [ "$f" = "$aside/sudoers.orig" ] && continue
                [ -f "$f" ] && mv -f "$f" /etc/sudoers.d/
              done
              if [ "$edit_main" = yes ]; then
                cp -p "$aside/sudoers.orig" "$new" && mv -f "$new" "$main"
              fi
              exit 1
            fi
            echo "Every NOPASSWD grant after narrowing:"
            grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d || true
          ' || { echo "::error::narrowing sudo failed (staged /etc/sudoers rejected by visudo -c -f, or visudo -c after it); see the lines above"; exit 1; }
          sudo -k
          if sudo -n true 2>/dev/null; then
            echo "::error::root sudo is still passwordless after narrowing; some grant the step does not recognize remains:"
            sudo grep -rn NOPASSWD /etc/sudoers /etc/sudoers.d || true
            exit 1
          fi
          echo "root sudo now needs a password"
          /usr/bin/sudo -n -l 2>&1 || true
          sudo -k
          if ! /usr/bin/sudo -n --user=_yolojail /usr/bin/env /usr/bin/true; then
            echo "::error::the run-as rule does not hold once root sudo is narrowed (/usr/bin/sudo -n --user=_yolojail /usr/bin/env /usr/bin/true failed); did 'Create the sandbox account' install /etc/sudoers.d/yolo-jail?"
            exit 1
          fi
          echo "the run-as rule holds: sudo runs commands as _yolojail with no password"

      # The launch tests that must hold with root sudo out of reach. YOLO_TEST_MACOS_USER_NARROW_SUDO
      # declares that this step narrowed it, so TestMacosUserPasswordlessStartAndExit runs rather
      # than skipping (it skips everywhere else, where a broad rule would pass it vacuously), and
      # YOLO_TEST_MACOS_USER makes a run in which all three skipped exit non-zero, as above.
      - name: macos-user passwordless start and exit (sudo narrowed to the rule)
        if: ${{ !cancelled() && steps.narrow.outcome == 'success' }}
        run: go test -count=1 -timeout 0 -v -run '^TestMacosUser(PasswordlessStartAndExit|TheGuestCannotWriteTheStagingRoot|TerminateEndsTheSessionThroughItsTeardown)$' ./integration
        env:
          YOLO_TEST_MACOS_USER: "1"
          YOLO_TEST_MACOS_USER_NARROW_SUDO: "1"

  # REAL VENDOR INSTALLS ON darwin: OQ-CI7, ruled 2026-10-05 as the doc's option (c)
  # (docs/reference/agent-install-in-ci.md#OQ-CI7). darwin is the one platform whose
  # vendor builds no other CI job installs: Pack Installs (packs.yml) installs the
  # linux-x64 and linux-arm64 builds, and the podman nightly's jail is linux-x64 in a
  # VM. A macos-user launch installs the vendor's DARWIN build through the same
  # generated launcher, and the `via: npm` half of that had never run on a Mac.
  #
  # ONE JOB PER PACK, failing hard, as Pack Installs' cells do (OQ-CI3): a single
  # sequential job dies on the first bad install and masks every vendor after it, so a
  # red cell names its vendor in the job name. `fail-fast: false` and no
  # `continue-on-error` anywhere in this job, the account step included: with no
  # Seatbelt tests here, a failed setup has nothing left to report and should stop the
  # cell with its own error.
  #
  # A job of its own beside the one above, not steps inside it, and with no `needs:`.
  # One job's red must not hide the other's result: the job above answers whether the
  # backend works, and a vendor's darwin release cannot decide that. The steps
  # duplicate the job above's on purpose; change one, check the other.
  #
  # The schedule is this workflow's, so a vendor's darwin release turns a scheduled run
  # red and no push waits on it, which is what keeps the push gate a pure function of
  # the repository (agent-install-in-ci.md, P1). That is the second reason, beside the
  # cost one at the top of this file, never to put this workflow on push or
  # pull_request without first moving this job out of it.
  install:
    strategy:
      fail-fast: false
      matrix:
        # THE `via: npm` PACKS FIRST, as ruled: they are listed, and so queued, ahead
        # of the installer packs, because the npm half is the one never measured on a
        # Mac. A hand-maintained mirror of integration/agents_test.go's packMatrix,
        # less any pack whose manifest `platforms` exclude darwin/arm64, and
        # TestMacosUserPackInstallsWorkflowMirrorsPackMatrix fails `just check-ci`
        # when it drifts: a pack missing or extra, a pack its runner's platform cannot
        # install, an npm pack listed after an installer one, or a cell that would
        # select another pack's subtest. `rg -n '"via"' packs/*/pack.json` is the split.
        pack: [opencode, pi, omp, chrome-devtools, copilot, claude, codex, agy, muse-code]
    # The job above says why macos-latest (Apple Silicon, floating). The pin test
    # derives the list above from this label's platform (macosUserRunnerPlatforms), so
    # a move to another label fails `just check-ci` until the list matches that
    # label's platform.
    runs-on: macos-latest
    name: install ${{ matrix.pack }} from its vendor (macos-user, darwin)
    # A CEILING ON WASTE, as in Pack Installs. One launch here installs one agent, on a
    # floor "Build the macOS floor" realized first; the suite's own per-launch deadline
    # (macosUserTimeout, YOLO_TEST_MACOS_USER_TIMEOUT) fires first on a wedged install.
    # The 60 above the former 60 is exactly that step's ceiling; no test's budget moved.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # As above: the harness's plain `go build` reports a live `git describe`.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For correlating a vendor's darwin break with an OS bump, and for the `sudo -n`
      # fact the account step below needs, as in the job above. Informational only.
      # TestMacosUserWorkflowRecordsSudoBeforeAccountSetup fails `just check-ci` if a job
      # runs macos-setup without recording that fact first.
      - name: Runner facts
        run: |
          sw_vers
          uname -m
          sudo -n true && echo "sudo -n: passwordless" || echo "sudo -n: WOULD PROMPT"

      # As above, and NOT under sudo, for the same reason.
      - name: Create the sandbox account
        run: go run ./cmd/yolo macos-setup

      # As in the job above, and for its reason: a cold floor (the rustls mise after a
      # change to its derivation) must not be paid inside the install test's deadline.
      - name: Build the macOS floor (before any launch)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          start=$(date +%s)
          env -u YOLO_EXTRA_PACKAGES nix build --impure --accept-flake-config --no-link \
            --print-out-paths ".#packages.${sys}.yoloNoncontainerProfile"
          echo "the floor took $(( $(date +%s) - start ))s to realize" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # -run selects this pack's subtest and no other, so a red cell names its vendor in
      # the job name. YOLO_TEST_REAL_PACK_INSTALLS un-skips the install
      # (requireRealPackInstalls); YOLO_TEST_MACOS_USER declares this a macos-user job,
      # so a cell whose subtest SKIPPED exits non-zero instead of passing as green
      # (integration/macosusergate_test.go). No YOLO_RUNTIME, for the reason the job
      # above gives. The probe is the Linux cell's own (packInstallProbe): `<bin>
      # --version` and file reads only, never an agent session or an API call.
      - name: Install ${{ matrix.pack }} from its vendor
        run: |
          go test -count=1 -timeout 0 -v ./integration \
            -run '^TestMacosUserPackInstallsVersionsAndConfigures$/^${{ matrix.pack }}$'
        env:
          YOLO_TEST_MACOS_USER: "1"
          YOLO_TEST_REAL_PACK_INSTALLS: "1"
