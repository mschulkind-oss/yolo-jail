name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt every JavaScript action into Node.js 24 ahead of GitHub's
# 2026-06-02 default switch.  ``actions/upload-artifact@v5`` still
# bundles Node 20 in its ``action.yml`` (no v6 with Node 24 yet);
# this env var overrides that for the whole workflow without
# pinning to a beta tag, and silences the runtime deprecation
# annotation we'd otherwise get on every CI run.  Removable once
# every pinned action ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # The Go tree gets its own job, running the SAME gate as the local
  # pre-commit hook: `just check-ci` = go vet + staticcheck, once per GOOS the
  # tree targets (linux and darwin — see the `lint` recipe for why the darwin
  # pass runs on this Linux runner rather than on check-macos), plus a gofmt
  # cleanliness check and the short test suite.  Invoking the Justfile recipe
  # rather than inlining the commands is deliberate — it's the only way CI
  # and the hook can't drift, and it was drift that let staticcheck/gofmt go
  # unenforced on any push from a machine without the hook.  The short suite
  # carries guards nothing else enforces automatically (TestEmbedMatchesTree —
  # the go:embed/tree sync for the official PACKS, which is where every loophole
  # yolo ships lives since `bundled_loopholes/` was deleted on 2026-08-19; the
  # version stamp contract; the config/argv regression suites).
  check-go:
    runs-on: ubuntu-latest
    steps:
      # Full history AND TAGS, which the short suite reads: packs'
      # TestShippedPacksDecodeUnderTheLastRelease builds the last release tag's
      # in-jail pack reader from git and runs this tree's shipped packs through
      # that release's boot-time decode passes (manifests, surfaces, overlays),
      # so a manifest change any of them would refuse fails here. And
      # tools/tap-install-check's TestTheJudgeAcceptsWhatTheLastReleaseReportsOnABareMac
      # builds the last release's `yolo check`, the one the tap carries, and runs
      # it through the tap-install job's judge.
      # Under GitHub Actions a missing tag is a failure, not a skip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The same `just check-ci` gate checks the published user guide with
      # pinned vantage-check via uvx. Keep CI and the local gate on one command.
      - uses: astral-sh/setup-uv@v7

      # `just check-ci` needs `just` itself plus staticcheck.  Installed
      # directly rather than through mise-action so this job doesn't also
      # drag in the Node toolchain that mise.toml pins for local dev.
      #
      # From casey/just's GitHub release, NOT `just.systems/install.sh`: that
      # script is a third-party CDN hop with no retry, and on 2026-09-06 it
      # answered the runner with a bare `curl: (22) ... 403` and took the whole
      # quality gate down before a line of Go ran.  `gh` is preinstalled on the
      # runner and authenticated with the job's own token, so this is the one
      # path GitHub already guarantees us.  Unpinned `latest` is deliberate: it
      # matches mise.toml's `just = "latest"`, and a CI pinned tighter than
      # local dev is exactly the gate-vs-hook drift this job exists to catch.
      # The Justfile needs just >= 1.47 (`lint`'s `[env]`, `check-ci`'s
      # `[parallel]`); `latest` is far past that, and an older just would refuse
      # to parse the file rather than run a different gate.
      - name: Install just and staticcheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          case "$(uname -m)" in
            x86_64)  just_arch=x86_64-unknown-linux-musl ;;
            aarch64) just_arch=aarch64-unknown-linux-musl ;;
            *) echo "no just release asset for $(uname -m)" >&2; exit 1 ;;
          esac
          downloaded=
          for attempt in 1 2 3; do
            if gh release download --repo casey/just \
                 --pattern "just-*-${just_arch}.tar.gz" \
                 --output /tmp/just.tar.gz --clobber; then
              downloaded=1
              break
            fi
            echo "just download attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          [ -n "$downloaded" ] || {
            echo "could not download just from casey/just releases" >&2
            exit 1
          }
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The short suite runs the JavaScript yolo ships for agents (the footer
      # adapters, the pi extensions) under node, and a test that needs node
      # SKIPS when node is absent, so a from-source `go test -short` on a
      # machine without it stays green. That skip is safe only while CI has
      # node. This job installs none (the runner image ships it), so this step
      # makes an image that stops shipping node a red job rather than a suite
      # that quietly stops running those tests. check-macos has the same step.
      - name: Node is on PATH (the short suite's node tests skip without it)
        run: |
          node --version || {
            echo "::error::node is not on PATH, so the short suite would SKIP every test that runs yolo's shipped JavaScript instead of running it" >&2
            exit 1
          }

      - name: Quality gate (vet + staticcheck + gofmt + short tests)
        run: just check-ci

  # Deliberately tests only — no lint.  The darwin STATIC analysis a from-source
  # macOS contributor would hit runs in check-go under `GOOS=darwin` (Justfile,
  # `lint` recipe), from Linux, where the pre-commit hook reaches it too.  What
  # this job is for is the half a cross-GOOS analysis cannot give: darwin-only
  # code actually RUNNING — including the PATH-resolution class AGENTS.md
  # describes, where /var/folders is a symlink and Linux cannot disagree.
  check-macos:
    runs-on: macos-latest
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Tags too, for the same last-release tests check-go runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Why this job asserts node before the suite: check-go's step of the same name.
      - name: Node is on PATH (the short suite's node tests skip without it)
        run: |
          node --version || {
            echo "::error::node is not on PATH, so the short suite would SKIP every test that runs yolo's shipped JavaScript instead of running it" >&2
            exit 1
          }

      - name: Unit tests (macOS)
        run: go test -short ./...

  build-image:
    # Build the jail image on BOTH arches natively — x86_64 and arm64 — so
    # linux/arm (aarch64-linux) is a tested target, not just an aspirational
    # claim.  ubuntu-24.04-arm is a free, unlimited hosted runner on this
    # public repo.  Native per-arch build (no QEMU/--platform): nix
    # substitutes the whole closure from cache.nixos.org for aarch64-linux
    # and compiles only the few repo-local derivations.  The Free-disk-space
    # `rm -rf … || true` below no-ops harmlessly on the arm image's absent
    # x86 toolchains.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    needs: check-go
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub-hosted runners start with ~14 GB free on /.  A full nix build
      # of yolo-jail (chromium + gcc + podman + nix) needed ~8 GB of store
      # plus the 4.3 GB streamed image tar on top of that, and ran OOD on
      # the last run.  Strip the ~25 GB of preinstalled toolchains we never
      # touch and prune the runner's preinstalled docker image cache before
      # building (the runner's docker daemon is unrelated to yolo-jail).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build minimal jail image
        # The minimal variant drops chromium, the gcc toolchain, nested-podman,
        # and assorted dev/debug tools — roughly 1.6–2 GB off the streamed tar.
        # It still contains everything the ./integration suite exercises.  The full
        # image builds locally via `just build-image` and runs in production.
        # --accept-flake-config so the flake's own yolo-jail.cachix.org
        # substituter is honored; without it nix warns and DISCARDS it, and this
        # job (which has no cachix-action to add it to nix.conf) builds every
        # image path from source. Added 2026-09-02 after measuring the publish
        # job reading the cache only by the action's grace.
        # Since layer-aware delivery landed the out-link is a nix2container
        # image.json rather than a script whose stdout is a docker-archive
        # (docs/reference/image-staging-vs-baking.md#delivering-into-the-runtime), so the tar this job
        # UPLOADS is produced by a `skopeo copy` into the docker-archive
        # transport. The copier is realized beside the image as `./result-1`; it
        # is a source build over nixpkgs' skopeo that no public cache serves, so
        # this step pays it once per nixpkgs (~2m cold).
        #
        # The archive still carries `localhost/yolo-jail:latest`, because the
        # consuming jobs `podman load < tar` and then look for a name in the
        # yolo-jail repository. That name is a CI convenience only — a real
        # launch never streams a tar and names the image by its content ref.
        run: |
          nix build --impure --accept-flake-config .#ociImageMinimal .#imageCopier
          ./result-1/bin/skopeo --insecure-policy copy \
            "nix:$(readlink -f ./result)" \
            "docker-archive:/tmp/jail-image.tar:localhost/yolo-jail:latest"
          ls -lh /tmp/jail-image.tar

      - name: Upload jail image
        uses: actions/upload-artifact@v7
        with:
          name: jail-image-${{ matrix.os }}
          path: /tmp/jail-image.tar
          retention-days: 1

  integration:
    # Run the end-to-end podman suite on both arches — this is where arch
    # actually matters (dynamic-linker resolution, ldconfig, agent installs).
    # A red arm cell in the agent-install matrix means an agent CLI lacks a
    # linux-arm64 upstream build; gate that agent out of the arm matrix rather
    # than patching the test.
    #
    # SHARDED, two runners per arch, because the suite is serial by design (no
    # t.Parallel(); see AGENTS.md) and one runner running all of it had become the
    # longest job in the workflow. More runners is the only way to divide a serial
    # suite. Each shard pays the setup steps and the image load again; the tests
    # divide. The partition is COMPUTED, never written down — see "Select this
    # shard's tests" — and `integration-complete` below checks that the shards of
    # each arch ran every listed test exactly once.
    #
    # INTEGRATION_SHARDS must equal the length of `matrix.shard`. The two cannot
    # share one spelling (a matrix may not read `env`), so a mismatch is caught
    # instead: too few shards leaves tests unrun and too many runs one twice, and
    # `integration-complete` fails on either.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        shard: [1, 2]
    name: integration (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    needs: build-image
    timeout-minutes: 120
    env:
      INTEGRATION_SHARDS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same disk pressure considerations as build-image.  Loading the image
      # into podman's rootless store doubles its on-disk footprint, and the
      # integration test suite pulls additional nix closures on top.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # accept-flake-config is for the tests that run `nix build .#ociImage`
      # THEMSELVES rather than through yolo (archivedelta_test.go,
      # layerplan_test.go). yolo's own nix calls already pass
      # --accept-flake-config (internal/image/nixflags.go); those direct calls do
      # not, so nix discards flake.nix's yolo-jail.cachix.org substituter for them
      # and this runner compiles the image copier (a patched skopeo that no public
      # cache serves) and builds the full image's layers from a cold store. The
      # build-image job has no closure to hand over: it builds the MINIMAL image,
      # and those tests build the full one. The nightly's build-image job pushes
      # the full image and the copier to yolo-jail.cachix.org, so a flake this
      # nightly has built is substituted here instead. A flake nobody has built
      # yet is a cache miss and builds exactly as before, so this costs time only
      # when it misses and never changes what a test builds or asserts: the store
      # paths are the same either way. Reading the public cache needs no secret.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # jq renders the `go test -json` stream the test step records (below).
      - name: Install Podman, socat and jq
        run: sudo apt-get update && sudo apt-get install -y podman socat jq

      # The facts a red TestInJailServiceReachability needs, captured while the
      # runner still exists.  That test's own failure message tells the reader to
      # run `podman info --format '{{.Host.RootlessNetworkCmd}}'` ON THE HOST —
      # and nobody can log into a hosted runner after the fact, so the answer has
      # to be printed on every run, green ones included.
      #
      # Not hypothetical: on 2026-08-31 the ubuntu-24.04 images downgraded podman
      # 5.8.4 -> 4.9.3 (actions/runner-images#14642), which removed
      # rootlessNetworkCmd from `podman info` entirely (the field only exists from
      # podman 5.1) and took every jail-facing service down.  Establishing that
      # from the logs afterwards took correlating four runs against their runner
      # image versions, because none of them said what stack they were on.
      #
      # It can never fail the job: this is a witness, not a gate, and a
      # diagnostic that turns a red test into a red job before anyone reads it
      # has made the report worse.  `--format` templates are avoided for the same
      # reason — a missing field is a template error, which is precisely the case
      # worth reporting.
      - name: Rootless network stack (diagnostic)
        run: |
          podman --version || true
          podman info --format json > /tmp/podman-info.json 2>/dev/null || true
          python3 - <<'PY' || true
          import json
          try:
              info = json.load(open("/tmp/podman-info.json"))
          except Exception as e:
              print("podman info unreadable:", e)
              raise SystemExit(0)
          host = info.get("host") or {}
          print("podman version:      ", (info.get("version") or {}).get("Version"))
          print("rootless:            ", (host.get("security") or {}).get("rootless"))
          print("rootlessNetworkCmd:  ",
                host.get("rootlessNetworkCmd", "<absent — podman older than 5.1>"))
          for helper in ("slirp4netns", "pasta"):
              h = host.get(helper) or {}
              print(f"{helper}:".ljust(21),
                    h.get("executable") or "<none podman can name>",
                    (h.get("version") or "").splitlines()[:1])
          PY

      - name: Download jail image
        uses: actions/download-artifact@v8
        with:
          name: jail-image-${{ matrix.os }}
          path: /tmp

      - name: Load jail image
        run: podman load < /tmp/jail-image.tar

      # THE PARTITION IS COMPUTED, NOT WRITTEN DOWN, the same way nightly-macos.yml
      # computes its shards: a hand-kept regex per shard rots the first time
      # somebody adds a test, and it rots SILENTLY, the unassigned test never
      # running and every shard staying green. So each shard takes its bucket from
      # `go test -list`, round-robin over the sorted names. A listing runs no
      # setup (TestMain's listingOnly), so it needs no image. Round-robin is not
      # time-balanced: a shard that collects more of the slow tests runs longer.
      - name: Select this shard's tests
        id: shard
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard
          go test -list '.*' ./integration | grep -E '^Test' | sort > /tmp/shard/all-tests
          total="$INTEGRATION_SHARDS"
          idx=${{ matrix.shard }}
          echo "$total" > /tmp/shard/total
          awk -v t="$total" -v i="$idx" 'NR % t == (i - 1) % t' /tmp/shard/all-tests > /tmp/shard/my-tests
          count=$(wc -l < /tmp/shard/my-tests | tr -d ' ')
          echo "shard $idx/$total selected $count of $(wc -l < /tmp/shard/all-tests | tr -d ' ') tests"
          # A SHARD THAT RUNS NOTHING MUST NOT BE GREEN: an empty bucket would
          # pass having tested nothing. (A shard index past INTEGRATION_SHARDS
          # does not land here: it wraps onto another shard's bucket, and
          # integration-complete reports the duplicate.)
          if [ "$count" -eq 0 ]; then
            echo "::error::shard $idx selected 0 tests — the partition is broken, refusing to pass vacuously"
            exit 1
          fi
          echo "pattern=^($(paste -sd'|' /tmp/shard/my-tests))$" >> "$GITHUB_OUTPUT"

      - name: Integration tests
        # Serial by construction: the `integration` package uses no
        # t.Parallel(), so container tests run one at a time (real
        # containers; session image load must not race).  -count=1
        # defeats Go's test cache, which can't see container state;
        # -timeout 0 disables Go's global deadline (per-command
        # deadlines come from YOLO_TEST_JAIL_TIMEOUT; the job-level
        # timeout-minutes backstops a hang).
        #
        # -json, so the shard can report WHICH tests ran (integration-complete
        # reads it); jq prints each event's Output field, which is the same text
        # -v prints, so the log reads as it did. A line that is not JSON is
        # printed as it came. pipefail makes the step's status go test's.
        run: |
          set -euo pipefail
          go test -count=1 -timeout 0 -json -run "$PATTERN" ./integration \
            | tee /tmp/shard/integration.json \
            | jq -Rj --unbuffered '. as $line | (try fromjson catch null) as $e
                | if ($e | type) == "object" then ($e.Output // empty) else $line + "\n" end'
        env:
          YOLO_RUNTIME: podman
          PATTERN: ${{ steps.shard.outputs.pattern }}

      # Top-level tests only: a subtest runs wherever its parent does.
      - name: Record which tests this shard ran
        run: |
          set -euo pipefail
          jq -Rr 'fromjson? | select(type == "object" and .Test != null and (.Test | contains("/") | not)
              and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | .Test' \
            /tmp/shard/integration.json | sort -u > /tmp/shard/ran-tests
          echo "ran $(wc -l < /tmp/shard/ran-tests | tr -d ' ') tests"

      - name: Upload this shard's test record
        uses: actions/upload-artifact@v7
        with:
          name: integration-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            /tmp/shard/all-tests
            /tmp/shard/my-tests
            /tmp/shard/ran-tests
            /tmp/shard/total
          retention-days: 1

  # THE CHECK THAT A COMPUTED PARTITION STILL NEEDS. Every shard's bucket comes
  # from one deterministic listing, so the union is exhaustive by construction —
  # as long as INTEGRATION_SHARDS matches the matrix and every shard's listing
  # agrees. This job checks what the shards actually RAN rather than what they
  # meant to: per arch, each listed test ran in exactly one shard, every shard
  # declared the same total, and that total is the number of shards that
  # reported. It runs only when every shard is green (a red shard has already
  # failed the run), which is exactly the case a silently dropped test hides in.
  integration-complete:
    runs-on: ubuntu-latest
    needs: integration
    # ALWAYS runs, and fails unless every shard succeeded: GitHub counts a SKIPPED job as
    # passing a required status check, so without `always()` a red shard would skip this
    # job and a branch protection rule on this one stable name would let the PR merge.
    if: always()
    steps:
      - name: Every integration shard succeeded
        run: |
          result='${{ needs.integration.result }}'
          if [ "$result" != "success" ]; then
            echo "::error::the integration shards finished '$result', not success"
            exit 1
          fi

      - name: Download every shard's test record
        uses: actions/download-artifact@v8
        with:
          pattern: integration-shard-*
          path: /tmp/shards

      - name: Each arch's shards ran every listed test exactly once
        run: |
          set -euo pipefail
          cd /tmp/shards
          fail=0
          # Artifact names are integration-shard-<os>-<n>; an arch's group is the
          # name without its shard number.
          groups=$(printf '%s\n' integration-shard-* | sed -E 's/-[0-9]+$//' | sort -u)
          [ -d "$(printf '%s\n' integration-shard-* | head -1)" ] \
            || { echo "::error::no shard records were downloaded"; exit 1; }
          for g in $groups; do
            dirs=("$g"-[0-9]*)
            n=${#dirs[@]}
            first=${dirs[0]}
            for d in "${dirs[@]}"; do
              if [ "$(cat "$d/total")" != "$n" ]; then
                echo "::error::$d declared $(cat "$d/total") shards but $n reported for ${g#integration-shard-} — INTEGRATION_SHARDS and matrix.shard disagree"
                fail=1
              fi
              if ! cmp -s "$first/all-tests" "$d/all-tests"; then
                echo "::error::$d listed different tests from $first — the partition is only exhaustive over one listing"
                fail=1
              fi
            done
            dup=$(cat "${dirs[@]/%//ran-tests}" | sort | uniq -d)
            cat "${dirs[@]/%//ran-tests}" | sort -u > /tmp/union
            missing=$(comm -23 "$first/all-tests" /tmp/union)
            extra=$(comm -13 "$first/all-tests" /tmp/union)
            if [ -n "$dup" ]; then
              echo "::error::${g#integration-shard-}: tests ran in more than one shard:"; echo "$dup"; fail=1
            fi
            if [ -n "$missing" ]; then
              echo "::error::${g#integration-shard-}: listed tests that no shard ran:"; echo "$missing"; fail=1
            fi
            if [ -n "$extra" ]; then
              echo "::error::${g#integration-shard-}: tests ran that the listing does not name:"; echo "$extra"; fail=1
            fi
            echo "${g#integration-shard-}: $n shards ran $(wc -l < /tmp/union | tr -d ' ') of $(wc -l < "$first/all-tests" | tr -d ' ') listed tests" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"


