# Normal releases and legacy Homebrew backfills are orchestrated from trusted
# main. Target source is checked/built with read-only credentials; only the
# trusted-main upload jobs can write release/tap state.
name: Release
run-name: ${{ inputs.mode == 'homebrew-only' && format('Homebrew-only v{0}', inputs.version) || format('Release v{0} @ {1} / request {2}', inputs.version, inputs.sha, inputs.request_run_id) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish is only dispatched after a release request; homebrew-only is the existing version-only formula backfill"
        required: true
        default: homebrew-only
        type: choice
        options: [homebrew-only, publish]
      version:
        description: "Immutable release version (X.Y.Z or X.Y.Z-pre; do not include v)"
        required: true
        type: string
      sha:
        description: "Exact tag commit SHA (required for the initial publish request)"
        required: false
        type: string
      request_run_id:
        description: "Originating trusted-main release-request Actions run id"
        required: false
        type: string

permissions: {}

# Shared with publish.yml so Homebrew/Release creation and registry `latest`
# writes cannot race across workflows or regress to an older version.
concurrency:
  group: release-publication-global
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve only the immutable tag and prove trusted exact-CI eligibility
        id: target
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_REQUEST_RUN_ID: ${{ inputs.request_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != main ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::Release workflow source must be a main-scoped dispatch."
            exit 1
          fi
          version="$INPUT_VERSION"
          if [ "$INPUT_MODE" = publish ]; then
            if ! printf '%s\n' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::initial publish requires a full frozen SHA."
              exit 1
            fi
            if ! printf '%s\n' "$INPUT_REQUEST_RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$'; then
              echo "::error::initial publish requires its originating release-request run id."
              exit 1
            fi
            sha="$INPUT_SHA"
            order_check=1
          elif [ "$INPUT_MODE" = homebrew-only ]; then
            sha=$(RELEASE_VERSION="$version" EXPECTED_SHA="$INPUT_SHA" tools/release-wiring/resolve-tag.sh)
            order_check=0
          else
            echo "::error::unknown release mode."
            exit 1
          fi
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            WORKFLOW_SHA="$WORKFLOW_SHA" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RELEASE_VERSION="$version" RELEASE_SHA="$sha" RELEASE_PRETAG=0 RELEASE_ORDER_CHECK="$order_check" \
            tools/release-wiring/preflight.sh
          if [ "$INPUT_MODE" = publish ]; then
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GH_TOKEN="$GH_TOKEN" \
              RELEASE_VERSION="$version" RELEASE_SHA="$sha" REQUEST_RUN_ID="$INPUT_REQUEST_RUN_ID" \
              go run ./tools/release-wiring verify-release-request
          fi
          if [ "$INPUT_MODE" = publish ]; then
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_TAG="v${version}" tools/release-wiring/ensure-release-absent.sh
          else
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_TAG="v${version}" GH_TOKEN="$GH_TOKEN" tools/release-wiring/ensure-release-present.sh
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  prepare-target:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod

      - name: Verify target notes and official binary pins without write credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.eligibility.outputs.sha }}
          TARGET_ROOT: target
        run: tools/release-wiring/validate-target.sh

  goreleaser-prepare:
    if: inputs.mode == 'publish'
    needs: [eligibility, prepare-target]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod

      - name: Render target changelog as inert release data
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.eligibility.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-notes"
          git show "${RELEASE_SHA}:CHANGELOG.md" > "$RUNNER_TEMP/target-notes/CHANGELOG.md"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${RELEASE_VERSION}"
          (cd "$RUNNER_TEMP/target-notes" && "$GITHUB_WORKSPACE/scripts/changelog-section.sh" --link-base "$base" --unwrap "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md")

      - name: Refuse a target-selected GoReleaser configuration
        run: cmp --silent target/.goreleaser.yaml .goreleaser.yaml || { echo "::error::Target GoReleaser config differs from the trusted release config."; exit 1; }

      # GoReleaser v2.18.2 is checksum-verified and documented in the repair handoff.
      # --skip=publish performs the supported preparation pipes only. No GITHUB_TOKEN
      # or registry credential is present in this target-controlled build job.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          workdir: target
          args: release --clean --skip=publish --release-notes ${{ runner.temp }}/release-notes.md

      - name: Package only the supported inert GoReleaser output contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, stat, sys
          version = os.environ["RELEASE_VERSION"]
          target = pathlib.Path("target")
          dist = target / "dist"
          out = pathlib.Path("release-assets")
          if out.exists() or out.is_symlink():
              raise SystemExit("release-assets output path already exists")
          out.mkdir()
          platforms = {
              "darwin_amd64_v1": ("darwin", "amd64"),
              "darwin_arm64_v8.0": ("darwin", "arm64"),
              "linux_amd64_v1": ("linux", "amd64"),
              "linux_arm64_v8.0": ("linux", "arm64"),
          }
          archives = {f"yolo-jail_{version}_{os_name}_{arch}.tar.gz" for os_name, arch in platforms.values()}
          expected_top = archives | {"checksums.txt", "artifacts.json", "metadata.json", "config.yaml"} | {"yolo_" + name for name in platforms}
          if not dist.is_dir() or dist.is_symlink():
              raise SystemExit("GoReleaser dist output is not a real directory")
          top = {p.name for p in dist.iterdir()}
          if top != expected_top:
              raise SystemExit(f"unexpected GoReleaser dist paths: missing={sorted(expected_top-top)} extra={sorted(top-expected_top)}")
          for name in top:
              p = dist / name
              mode = p.lstat().st_mode
              if name in {"yolo_" + n for n in platforms}:
                  if not stat.S_ISDIR(mode) or p.is_symlink():
                      raise SystemExit(f"unexpected GoReleaser output type: {name}")
                  files = list(p.iterdir())
                  if len(files) != 1 or files[0].name != "yolo" or not stat.S_ISREG(files[0].lstat().st_mode) or files[0].is_symlink():
                      raise SystemExit(f"unexpected build directory content: {name}")
              elif not stat.S_ISREG(mode) or p.is_symlink() or p.stat().st_size <= 0:
                  raise SystemExit(f"unexpected GoReleaser output type: {name}")
          artifacts = json.loads((dist / "artifacts.json").read_text())
          expected_records = {("Metadata", "metadata.json", "dist/metadata.json"), ("Checksum", "checksums.txt", "dist/checksums.txt")}
          for name in archives:
              expected_records.add(("Archive", name, "dist/" + name))
          for slug in platforms:
              expected_records.add(("Binary", "yolo", f"dist/yolo_{slug}/yolo"))
          records = set()
          for record in artifacts:
              key = (record.get("type"), record.get("name"), record.get("path"))
              if key in records or key not in expected_records:
                  raise SystemExit(f"unexpected/duplicate GoReleaser metadata record: {key}")
              records.add(key)
          if records != expected_records:
              raise SystemExit(f"GoReleaser artifact manifest incomplete: missing={sorted(expected_records-records)}")
          lines = (dist / "checksums.txt").read_text().splitlines()
          checks = {}
          for line in lines:
              m = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]*)", line)
              if not m or m.group(2) in checks:
                  raise SystemExit("malformed or duplicate checksums.txt entry")
              checks[m.group(2)] = m.group(1)
          pack_dir = target / "bundle/pack-binaries"
          extras = set(checks) - archives
          if set(checks) != archives | extras:
              raise SystemExit("checksum asset set is malformed")
          pack_files = {}
          if pack_dir.exists():
              if not pack_dir.is_dir() or pack_dir.is_symlink():
                  raise SystemExit("pack-binaries output is not a real directory")
              for item in pack_dir.iterdir():
                  mode = item.lstat().st_mode
                  if not stat.S_ISREG(mode) or item.is_symlink() or item.name in pack_files:
                      raise SystemExit(f"unsafe pack-binary output: {item.name}")
                  pack_files[item.name] = item
          if set(pack_files) != extras:
              raise SystemExit(f"pack-binary output/checksum mismatch: missing={sorted(extras-set(pack_files))} extra={sorted(set(pack_files)-extras)}")
          for name, expected in checks.items():
              source = dist / name if name in archives else pack_files[name]
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f"checksum mismatch for {name}")
              shutil.copyfile(source, out / name)
          shutil.copyfile(dist / "checksums.txt", out / "checksums.txt")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish-release:
    if: inputs.mode == 'publish'
    needs: [eligibility, goreleaser-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render notes and publish only validated files from trusted main
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.eligibility.outputs.sha }}
          REQUEST_RUN_ID: ${{ inputs.request_run_id }}
          RELEASE_PRETAG: "0"
          RELEASE_ORDER_CHECK: "1"
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-notes"
          git show "${RELEASE_SHA}:CHANGELOG.md" > "$RUNNER_TEMP/target-notes/CHANGELOG.md"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${RELEASE_VERSION}"
          (cd "$RUNNER_TEMP/target-notes" && "$GITHUB_WORKSPACE/scripts/changelog-section.sh" --link-base "$base" --unwrap "$RELEASE_VERSION" > "$RELEASE_NOTES_FILE")
          go run ./tools/release-wiring verify-release-request
          tools/release-wiring/publish-release.sh
          VERSION="$RELEASE_VERSION" RELEASE_TAG="v${RELEASE_VERSION}" tools/release-wiring/update-homebrew.sh

  homebrew-only:
    if: inputs.mode == 'homebrew-only'
    needs: [eligibility, prepare-target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable old source and publish only the formula update
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.eligibility.outputs.sha }}
          RELEASE_PRETAG: "0"
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tools/release-wiring/preflight.sh
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_TAG="v${RELEASE_VERSION}" tools/release-wiring/ensure-release-present.sh
          VERSION="$RELEASE_VERSION" RELEASE_TAG="v${RELEASE_VERSION}" tools/release-wiring/update-homebrew.sh
