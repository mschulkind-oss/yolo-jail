# Release — tag-triggered goreleaser + homebrew tap update (★ step 2 of the Go
# transition; shape copied from mschulkind-oss/swarf).
#
# Releasing = `just release <version>`, which refuses unless CHANGELOG.md has a
# written section for that version and the tree is clean, then pushes the v* tag
# this workflow runs on. goreleaser builds the host-facing yolo binary, creates
# the GitHub release, and uploads archives. The release BODY is that CHANGELOG.md
# section, extracted from the tag's own tree by scripts/changelog-section.sh and
# handed to goreleaser as --release-notes (see the goreleaser job); goreleaser's
# commit-subject changelog is never published.
# publish.yml
# (PyPI wheels + image pushes) runs off the SAME tag push — NOT off the
# release event: goreleaser creates the release with the workflow-scoped
# GITHUB_TOKEN, and GitHub's recursion guard means bot-created events never
# trigger other workflows. The homebrew formula is a SOURCE-BUILD formula
# (depends_on go), regenerated here by hand — no homebrew-pypi-poet, no PyPI
# dependency.
#
# Divergences from swarf, on purpose:
#   - the standalone host-daemon binaries were retired — their logic is reached
#     via the hidden `yolo internal daemon <name>` subcommands; yolo-ps (the
#     in-jail host-processes client) ships only in the nix image, not the host
#     channels, so the host ship set is just yolo;
#   - the formula is a SOURCE-BUILD formula that produces the PREBUILT "two
#     files and a binary" bundle at install time: it `go build`s the host yolo,
#     then runs scripts/stage-source-bundle.sh (cross-compiling both Linux
#     arches, CGO off) into pkgshare/. The flake's prebuilt short-circuit then
#     builds the jail image from that bundle with no toolchain at runtime;
#   - no Utils.git_short_head in the formula ldflags — the source tarball has
#     no .git, so only the version is stamped (internal/version.GitCommit
#     stays empty for brew builds; goreleaser archives carry it);
#   - workflow_dispatch backfill input kept from the old publish.yml brew job
#     so a formula push can be re-run without re-releasing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to re-run the homebrew formula push for, e.g. 0.7.0. The goreleaser job is skipped — the GitHub release must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The release body is the tag's own CHANGELOG.md section, never a commit
      # list. `just release` runs this same script before it will create a tag,
      # so on a release cut that way this cannot fail. It fails loudly when it
      # does: a tag pushed by hand skipped the gate, and the fix is a new tag,
      # because a tag is never moved.
      #
      # `--link-base` turns the file's repository-relative links into absolute
      # ones pinned to this tag: the release page is /releases/tag/<tag>, where a
      # relative href resolves under /releases/tag/ and 404s. `--unwrap` joins the
      # file's hard-wrapped paragraphs, because GitHub renders every newline in a
      # release body as a line break.
      #
      # The notes are written to $RUNNER_TEMP, OUTSIDE the checkout: goreleaser
      # refuses to release from a dirty tree, and a notes file in the workspace
      # would make it one.
      - name: Extract the release notes from the tag's CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          if ! sh scripts/changelog-section.sh --link-base "$base" --unwrap "$version" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::${GITHUB_REF_NAME} has no usable CHANGELOG.md section — it was not cut with 'just release'."
            echo "Delete this tag, write the [${version}] section, and cut it again with: just release ${version}"
            exit 1
          fi
          echo "Release notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines from the [${version}] section"

      # --release-notes replaces goreleaser's generated changelog with the file:
      # goreleaser's changelog pipe loads the file and returns before it builds
      # the commit list (internal/pipe/changelog, Run). Do NOT set
      # `changelog.disable: true` in .goreleaser.yaml to get the same effect —
      # that skips the whole pipe, including the load, and the release would go
      # out with an empty body.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    # `always()` so the job still runs when goreleaser is skipped (manual
    # dispatch); the inner condition then gates on either the release having
    # succeeded, or the event being manual.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.goreleaser.result == 'success')
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Updating homebrew formula for yolo-jail ${VERSION}"

      - name: Generate formula
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          TARBALL="https://github.com/mschulkind-oss/yolo-jail/archive/refs/tags/${TAG}.tar.gz"
          # -f is load-bearing: without it a 404 (typo'd dispatch version) or
          # transient 5xx exits 0 and the ERROR BODY's sha gets baked into a
          # formula that every `brew install` then fails to verify.
          SHA256=$(curl -fsSL --retry 3 "$TARBALL" | sha256sum | cut -d' ' -f1)
          if ! echo "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Bad sha256 for ${TARBALL}: ${SHA256}" >&2
            exit 1
          fi

          cat > yolo-jail.rb <<FORMULA
          class YoloJail < Formula
            desc "Declarative agentic development environments, from a sealed jail to your host"
            homepage "https://github.com/mschulkind-oss/yolo-jail"
            url "${TARBALL}"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on "go" => :build

            def install
              ldflags = %W[
                -s -w
                -X github.com/mschulkind-oss/yolo-jail/internal/version.buildVersion=#{version}
              ]
              system "go", "build", *std_go_args(output: bin/"yolo", ldflags: ldflags.join(" ")), "./cmd/yolo"

              # Produce the PREBUILT "two files and a binary" bundle beside the
              # binary so a checkout-less install builds the jail image
              # (nix build .#ociImage) with NO Go toolchain and NO source tree at
              # runtime — the flake's prebuilt short-circuit consumes
              # bin/linux-<arch>. The script cross-compiles both Linux arches
              # (CGO off; needs no C toolchain), stamping the release version so
              # the image binaries self-identify. It writes flake.nix, flake.lock
              # and bin/linux-{amd64,arm64}/ into pkgshare; BundledSourceDir finds
              # it at ../share/yolo-jail relative to bin/yolo. See
              # internal/reporoot + scripts/stage-source-bundle.sh.
              with_env("VERSION" => version.to_s) do
                system "scripts/stage-source-bundle.sh", pkgshare.to_s
              end
            end

            def caveats
              <<~EOS
                The first \`yolo\` run in a workspace builds or pulls the jail's
                container image (nix), which takes a while; later runs reuse it.
              EOS
            end

            test do
              assert_match "yolo-jail #{version}", shell_output("#{bin}/yolo --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' yolo-jail.rb
          echo "--- Generated formula ---"
          cat yolo-jail.rb

      - name: Push to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mschulkind-oss/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp yolo-jail.rb tap/Formula/yolo-jail.rb
          cd tap
          git config user.name "yolo-jail release bot"
          git config user.email "noreply@github.com"
          git add Formula/yolo-jail.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "yolo-jail ${VERSION}"
          git push
