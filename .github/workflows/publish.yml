# Publish — PyPI wheels + image-cache/builder pushes for a release.
# ★ step 2 of the Go transition: the PyPI package is now per-platform wheels
# wrapping the Go host binaries (built by tools/build-wheels), preserving the
# pipx/uvx audience and the one console script (yolo). The
# homebrew tap update moved to release.yml (source-build formula, no poet).
# Image-cache + builder-image pushes are unchanged.
#
# ⚠ Trigger: the v* TAG PUSH is the load-bearing trigger, NOT the GitHub
# release. goreleaser (release.yml) creates the release with the
# workflow-scoped GITHUB_TOKEN, and GitHub's recursion guard means
# bot-token-created events NEVER trigger `on: release` workflows — a
# release-only trigger would silently never fire on the documented
# "releasing = push a v* tag" flow. The release trigger is kept as well so a
# HUMAN-published release (UI/gh — e.g. re-publishing after a failure) also
# works; `uv publish --check-url` and the image pushes are idempotent, and the
# concurrency group collapses double-fires.
#
# PyPI auth is Trusted Publishing (OIDC): pinned to THIS workflow filename +
# the `pypi` environment — renaming either breaks the publisher config.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write  # push the container builder image to GHCR

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build wheels (Go binaries, all platforms)
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./tools/build-wheels --version "$version" --output-dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/* --check-url https://pypi.org/simple/

  # Build both OCI image variants on Linux and push them to the Cachix cache
  # so macOS users download the prebuilt image instead of needing a Linux
  # builder.  Release-gated only.
  #
  # NO-OP UNTIL SET UP (see docs/plans/handoff-cachix-cache.md): the job skips
  # entirely unless the CACHIX_AUTH_TOKEN secret is configured — so releases
  # stay green before the Cachix account exists. The cache NAME is not a secret
  # and defaults to `yolo-jail` (the CACHIX_CACHE variable only overrides it,
  # e.g. for a fork pushing to its own cache).
  push-image-cache:
    # Push BOTH x86_64-linux and aarch64-linux closures — each matrix cell
    # builds + pushes its own native arch.  The aarch64-linux closure is the
    # SAME one Apple Silicon Macs consume, so this also serves the mac/arm
    # audience (previously the x86-only push left them building from source).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Cachix is configured
        id: gate
        run: |
          # Gate on the auth token alone — the cache NAME is not a secret and
          # defaults to `yolo-jail`. Publish the resolved name for later steps.
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "cache=${{ vars.CACHIX_CACHE || 'yolo-jail' }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cachix not configured (no CACHIX_AUTH_TOKEN secret). Skipping — see docs/plans/handoff-cachix-cache.md."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # Same disk pressure as the build-image job in ci.yml.
      - name: Free disk space
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Install Nix
        if: steps.gate.outputs.enabled == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        if: steps.gate.outputs.enabled == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ steps.gate.outputs.cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # cachix-action auto-pushes every path built while it's active, so a
      # `nix build` of both variants populates the cache.
      #
      # --accept-flake-config IS LOAD-BEARING, and its absence was a real defect
      # (fixed 2026-09-02). Without it nix prints `ignoring untrusted flake
      # configuration setting 'extra-substituters'` and the flake's own
      # yolo-jail.cachix.org declaration (flake.nix nixConfig) is DISCARDED — so
      # this job read the cache only by cachix-action's grace, which adds the
      # substituter to nix.conf itself. Measured on the v0.8.0 run
      # (31749547095): the four yolo-jail paths were substituted, and the two
      # warnings were printed in the same log. It worked, for a reason that
      # would vanish silently if this step were reordered or the action swapped.
      # Every other nix invocation this project makes passes the flag
      # (internal/image/nixflags.go, internal/darwinpkg/darwinpkg.go).
      - name: Build + push both image variants
        if: steps.gate.outputs.enabled == 'true'
        run: |
          nix build --impure --accept-flake-config .#ociImage
          nix build --impure --accept-flake-config .#ociImageMinimal
          echo "Pushed image closures to ${{ steps.gate.outputs.cache }}.cachix.org"

  # Build the macOS container-Linux-builder image and push it to GHCR, so
  # macOS users (Apple Container / Podman) `pull` a ready nix+sshd builder
  # instead of building a Linux image on a Mac (chicken-and-egg: a Mac needs a
  # Linux builder to build the builder).
  # See docs/research/macos-container-builder-exploration.md + the AC runbook.
  #
  # BOTH ARCHES, and x86_64 is NOT Intel-Mac support (BACKLOG E8).  This job
  # used to push `aarch64-linux` only — "it's the arch Apple Silicon runs; an
  # x86_64 mac (rare, and Podman-only) can build locally or use QEMU".  That
  # reasoning was about USERS, and CI is not a user: `nightly-macos.yml` has to
  # run on `macos-26-intel` because GitHub's Apple Silicon runners cannot nest
  # a VM for Podman Machine, so the ONLY hosted runner that exercises the macOS
  # code paths at all is x86_64.  With an arm64-only builder it pulled the wrong
  # arch and TestExtraPackageLibFarm / TestDevPackageLinksRuntimeLib failed with
  # "image platform (linux/arm64) does not match the expected platform
  # (linux/amd64)" — the lib farm never materialized.  Publishing multi-arch
  # makes the nightly test what it claims to test; it does not add Intel Macs to
  # the support matrix.
  #
  # Each arch builds NATIVELY on its own runner — no QEMU, no binfmt.  The
  # builder image's trivial derivations (writeText / writeShellScript /
  # runCommand for /etc) have to RUN on the target arch, so a cross-arch
  # `nix build .#packages.x86_64-linux.builderImage` on the arm runner cannot
  # substitute its way out of a build.  Same shape as push-image-cache above.
  push-builder-image:
    strategy:
      # Both cells run even when one fails, so a release reports BOTH arch
      # results instead of hiding the second.  publish-builder-index `needs:`
      # this job, so a failed cell means the multi-arch `:VERSION` / `:latest`
      # tags simply do not advance — consumers keep resolving the previous
      # release's index rather than a half-populated one.  Only the surviving
      # cell's per-arch tag moves, and nothing pulls those by name.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The flake output is a *streamer* that writes a docker-archive tar to
      # stdout (KEYLESS — the ssh key is injected at container-run time).
      # skopeo copies that tar straight to GHCR.
      #
      # PER-ARCH TAGS ONLY here (`:<version>-<arch>`, `:latest-<arch>`).  The
      # arch-free `:VERSION` / `:latest` are a manifest LIST composed by
      # publish-builder-index below — a naive second skopeo copy to the same tag
      # would not "add" an arch, it would OVERWRITE the first cell's push, and
      # which arch survived would be a matrix race.  A per-arch tag also keeps
      # each arch manifest permanently TAGGED, so the index cannot be broken by
      # an untagged-manifest cleanup policy later.
      #
      # `.#packages.${{ matrix.system }}` on its NATIVE runner: the image config's
      # `architecture` comes from nixpkgs' defaultArchitecture (go.GOARCH of the
      # dockerTools pkgs set), so the streamer stamps amd64/arm64 from the same
      # `system` attribute path — which is what makes the index entries truthful
      # rather than two copies of one arch under different tags.
      - name: Build + push builder image to GHCR
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolo-jail-builder"
          ARCH="${{ matrix.arch }}"
          # --accept-flake-config: honor the flake's cachix substituter.
          STREAMER=$(nix build --impure --accept-flake-config --no-link \
            --print-out-paths .#packages.${{ matrix.system }}.builderImage)
          "$STREAMER" > /tmp/builder.tar
          skopeo copy "docker-archive:/tmp/builder.tar" \
            "docker://${REPO}:${VERSION}-${ARCH}"
          skopeo copy "docker-archive:/tmp/builder.tar" \
            "docker://${REPO}:latest-${ARCH}"
          echo "Pushed ${REPO}:${VERSION}-${ARCH} and :latest-${ARCH}"
          # Visibility is a persistent, per-PACKAGE property — set ONCE (already
          # done for yolo-jail-builder) and inherited by every future tag push.
          # No per-release flip needed.  If the package is ever renamed, the new
          # name is created PRIVATE by the first push; flip it to Public once in
          # GHCR → Packages → yolo-jail-builder → Settings → Change visibility.
          # (No auto-PATCH here: the default GITHUB_TOKEN can't admin a
          # just-created org package, so it always 404'd — the step was a no-op
          # after the one-time manual flip and dead weight on every release.)

  # Compose the two per-arch builder manifests into ONE multi-arch index and put
  # the arch-free tags on it: `:<version>` and `:latest`.
  #
  # `:latest` is the string frozen in containerbuilder.BuilderImage and in the
  # mac-ac-container-builder runbook, so making it an INDEX (rather than teaching
  # the CLI to append an arch suffix) is what lets every consumer keep pulling one
  # name and get its own arch: an Apple Silicon Mac resolves arm64, the x86_64
  # nightly runner resolves amd64, and no Go code learns about arches.
  #
  # `imagetools create` is a REGISTRY-side operation — it reads the source
  # descriptors and writes a new index, pulling no layers and needing no daemon —
  # so this job is seconds long and does not rebuild anything.  buildx ships
  # preinstalled on the hosted ubuntu images; skopeo can copy a multi-arch image
  # but cannot COMPOSE an index out of two single-arch ones, which is the one
  # thing needed here.
  #
  # On the `docker` token: yolo-jail removed Docker as a RUNTIME (validate.go
  # hard-errors on `runtime: docker`) and the flake aliases dockerTools as
  # ociTools to keep the product free of it.  Neither applies to a hosted GitHub
  # runner's preinstalled buildx, which is CI plumbing and never ships — the same
  # standing as the `sudo docker image prune` disk-freeing step above and the
  # `docker://` transport skopeo already uses.  Nothing here reaches a user's
  # machine or a jail.
  publish-builder-index:
    needs: push-builder-image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compose the multi-arch index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolo-jail-builder"
          docker buildx imagetools create \
            --tag "${REPO}:${VERSION}" \
            --tag "${REPO}:latest" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"
          # Print what a consumer will actually resolve — both platforms must be
          # listed, or a puller silently falls back to the wrong-arch failure this
          # whole job exists to remove ("image platform (linux/arm64) does not
          # match the expected platform (linux/amd64)").
          docker buildx imagetools inspect "${REPO}:latest"
