# All publisher runs are sourced from main. The exact tag/SHA is data; target
# builds are read-only and use no registry/OIDC credential. The direct uv
# publisher keeps the existing filename, pypi environment and trusted-publishing
# identity. A release asset create-only claim precedes every build job.
name: Publish to PyPI
run-name: Publish v${{ inputs.version }} @ ${{ inputs.sha }} / request ${{ inputs.request_run_id }} / release ${{ inputs.release_run_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version (X.Y.Z or X.Y.Z-pre; do not include v)"
        required: true
        type: string
      sha:
        description: "Exact full tag commit SHA"
        required: true
        type: string
      request_run_id:
        description: "Originating trusted-main release-request Actions run id"
        required: true
        type: string
      release_run_id:
        description: "Successful original trusted-main GoReleaser run id"
        required: true
        type: string

permissions: {}

# Shared with release.yml across workflows: version checks and latest-tag writes
# are serialized rather than racing newer/older releases.
concurrency:
  group: release-publication-global
  cancel-in-progress: false

jobs:
  publisher-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate exact tag, CI, version order and original-run provenance
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_PRETAG: "0"
          RELEASE_ORDER_CHECK: "1"
          RELEASE_ORDER_ALLOW_CURRENT: "1"
          REQUEST_RUN_ID: ${{ inputs.request_run_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/release-wiring/preflight.sh
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_TAG="v${RELEASE_VERSION}" tools/release-wiring/ensure-release-present.sh
          go run ./tools/release-wiring verify-publisher-provenance

  claim-publication:
    needs: publisher-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Reverify trusted provenance and atomically claim the release before building
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_PRETAG: "0"
          RELEASE_ORDER_CHECK: "1"
          RELEASE_ORDER_ALLOW_CURRENT: "1"
          REQUEST_RUN_ID: ${{ inputs.request_run_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/release-wiring/preflight.sh
          go run ./tools/release-wiring verify-publisher-provenance
          go run ./tools/release-wiring check-version-order
          go run ./tools/release-wiring claim-publication

  build-wheels:
    needs: claim-publication
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod

      - name: Build exact target wheels with no publication credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        working-directory: target
        run: go run ./tools/build-wheels --version "$RELEASE_VERSION" --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels
          path: target/dist/
          if-no-files-found: error

  publish-wheels:
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: dist

      - name: Validate all six inert wheels before asking for PyPI identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: go run ./tools/release-wiring validate-wheels --version "$RELEASE_VERSION" --dir dist

      - uses: astral-sh/setup-uv@v7

      # Preserve direct Trusted Publishing from this named workflow/environment.
      # The claim, exact release-run provenance and artifact validation happen before upload.
      - name: Publish to PyPI
        run: uv publish dist/*.whl --check-url https://pypi.org/simple/ --trusted-publishing always

  cache-eligibility:
    needs: claim-publication
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      cache: ${{ steps.gate.outputs.cache }}
    steps:
      - name: Check whether optional Cachix publishing is configured
        id: gate
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHE_NAME: ${{ vars.CACHIX_CACHE || 'yolo-jail' }}
        run: |
          set -euo pipefail
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "cache=$CACHE_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cachix not configured; its optional release cache publication is skipped."
          fi

  build-image-cache:
    needs: [claim-publication, cache-eligibility]
    if: needs.cache-eligibility.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the target closures without the Cachix credential
        env:
          CACHE_ARCH: ${{ matrix.arch }}
          CACHE_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nix-binary-cache" nix-cache/store
          : > nix-cache/store-paths.txt
          for attr in ociImage ociImageMinimal imageCopier; do
            path=$(nix build --impure --accept-flake-config --no-link --print-out-paths ".#${attr}")
            printf '%s\n' "$path" >> nix-cache/store-paths.txt
          done
          paths=()
          while IFS= read -r path || [ -n "$path" ]; do
            paths+=("$path")
          done < nix-cache/store-paths.txt
          if [ "${#paths[@]}" -ne 3 ]; then
            echo "Expected exactly three Nix output paths; no cache upload is allowed." >&2
            exit 1
          fi
          nix copy --to "file://$RUNNER_TEMP/nix-binary-cache" "${paths[@]}"
          cp -a "$RUNNER_TEMP/nix-binary-cache/." nix-cache/store/

      - uses: actions/upload-artifact@v7
        with:
          name: nix-cache-${{ matrix.arch }}
          path: nix-cache/
          include-hidden-files: true
          if-no-files-found: error

  publish-image-cache:
    needs: [build-image-cache, cache-eligibility]
    if: needs.cache-eligibility.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: nix-cache-${{ matrix.arch }}
          path: nix-cache

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ needs.cache-eligibility.outputs.cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Import inert Nix paths and push the validated closure names
        env:
          CACHE_NAME: ${{ needs.cache-eligibility.outputs.cache }}
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path || [ -n "$path" ]; do
            paths+=("$path")
          done < nix-cache/store-paths.txt
          if [ "${#paths[@]}" -ne 3 ]; then
            echo "Nix cache artifact has an unexpected path count; refuse upload." >&2
            exit 1
          fi
          for path in "${paths[@]}"; do
            if [[ ! "$path" =~ ^/nix/store/[0-9a-z]{32}-[A-Za-z0-9._+?=-]+$ ]]; then
              echo "Nix cache artifact contains an unsafe store path; refuse upload." >&2
              exit 1
            fi
          done
          # The build job's runner-built paths carry no signature, and nix copy
          # refuses unsigned paths into the daemon store by default. Their trust
          # is this run's own artifact plus the store-path checks above.
          nix copy --no-check-sigs --from "file://$GITHUB_WORKSPACE/nix-cache/store" "${paths[@]}"
          cachix push "$CACHE_NAME" "${paths[@]}"

  build-builder-image:
    needs: claim-publication
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the exact target builder image without registry credentials
        env:
          BUILDER_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          streamer=$(nix build --impure --accept-flake-config --no-link --print-out-paths ".#packages.${BUILDER_SYSTEM}.builderImage")
          test -x "$streamer"
          "$streamer" > "$RUNNER_TEMP/builder.tar"
          if [ ! -s "$RUNNER_TEMP/builder.tar" ] || [ -L "$RUNNER_TEMP/builder.tar" ]; then
            echo "Target builder image did not produce a regular non-empty archive." >&2
            exit 1
          fi
          mkdir -p builder-output
          cp "$RUNNER_TEMP/builder.tar" builder-output/builder.tar

      - uses: actions/upload-artifact@v7
        with:
          name: builder-image-${{ matrix.arch }}
          path: builder-output/builder.tar
          if-no-files-found: error

  push-builder-image:
    needs: [build-builder-image, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: builder-image-amd64
          path: builder-amd64

      - uses: actions/download-artifact@v8
        with:
          name: builder-image-arm64
          path: builder-arm64

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the validated target images to version and latest-arch tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          GHCR_REPOSITORY="ghcr.io/${owner}/yolo-jail-builder"
          for arch in amd64 arm64; do
            archive="builder-${arch}/builder.tar"
            if [ ! -f "$archive" ] || [ -L "$archive" ] || [ ! -s "$archive" ]; then
              echo "Missing/unsafe builder artifact for ${arch}; no registry copy is safe." >&2
              exit 1
            fi
            expected_arch="$arch"
            image="docker-archive:${archive}"
            actual_platform=$(skopeo inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [ "$actual_platform" != "linux/${expected_arch}" ]; then
              echo "Builder artifact ${arch} identifies as ${actual_platform}; refuse registry upload." >&2
              exit 1
            fi
            skopeo copy "$image" "docker://${GHCR_REPOSITORY}:${RELEASE_VERSION}-${arch}"
            skopeo copy "$image" "docker://${GHCR_REPOSITORY}:latest-${arch}"
          done

  publish-builder-index:
    needs: [push-builder-image, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse publication replay at job entry
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Publication reruns are refused before credential actions or writes; inspect the original run and partial state read-only with the owner. Do not replay or remove the claim."
            exit 1
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compose the exact version and monotonic latest multi-arch index
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          GHCR_REPOSITORY="ghcr.io/${owner}/yolo-jail-builder"
          docker buildx imagetools create \
            --tag "${GHCR_REPOSITORY}:${RELEASE_VERSION}" \
            --tag "${GHCR_REPOSITORY}:latest" \
            "${GHCR_REPOSITORY}:${RELEASE_VERSION}-amd64" \
            "${GHCR_REPOSITORY}:${RELEASE_VERSION}-arm64"
          docker buildx imagetools inspect "${GHCR_REPOSITORY}:latest"
