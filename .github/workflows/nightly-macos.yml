name: Nightly macOS Integration

on:
  schedule:
    # Run at 06:00 UTC daily (1am EST / 10pm PST)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

# Opt every JavaScript action into Node.js 24 ahead of GitHub's
# 2026-06-02 default switch.  See ci.yml for full rationale.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build jail image
        # --accept-flake-config: honor the flake's yolo-jail.cachix.org
        # substituter. Without it nix discards it with a warning and this job
        # builds the whole closure from source — on the runner where that costs
        # the most (darwin realises an image on every launch).
        # Since layer-aware delivery landed the out-link is a nix2container
        # image.json rather than a script whose stdout is a docker-archive
        # (docs/design/layer-aware-image-delivery.md), so the tar this job
        # UPLOADS is produced by a `skopeo copy` into the docker-archive
        # transport. The copier is realized beside the image as `./result-1`; it
        # is a source build over nixpkgs' skopeo that no public cache serves, so
        # this step pays it once per nixpkgs (~2m cold).
        #
        # The archive still carries `localhost/yolo-jail:latest`, because the
        # consuming jobs `podman load < tar` and then look for a name in the
        # yolo-jail repository. That name is a CI convenience only — a real
        # launch never streams a tar and names the image by its content ref.
        run: |
          nix build --impure --accept-flake-config .#ociImage .#imageCopier
          ./result-1/bin/skopeo --insecure-policy copy \
            "nix:$(readlink -f ./result)" \
            "docker-archive:/tmp/jail-image.tar:localhost/yolo-jail:latest"

      - name: Upload jail image
        uses: actions/upload-artifact@v7
        with:
          name: jail-image
          path: /tmp/jail-image.tar
          retention-days: 1

  integration-macos:
    # macOS Intel runners support nested virtualization via Podman Machine;
    # GitHub's Apple Silicon runners do not, so stay on an -intel label.
    # macos-13 was retired Dec 2025. macOS 26 (Tahoe) is the last Intel macOS,
    # and GitHub plans to retire Intel runner images around late 2027 — after
    # that this job needs a self-hosted runner or arm64 nested-virt support.
    # Note: x86_64 not ARM — tests the macOS code paths, not native ARM performance.
    runs-on: macos-26-intel
    needs: build-image
    # SHARDED, because one job running the whole suite is not a measurement.
    # History: 2026-09-07 died at 1h12m on a real failure, 2026-09-08 lost the
    # runner at 1h54m with NO uploaded log, 2026-09-09 died at 1h35m the same
    # way. Two real causes and two runner deaths in three runs — at that
    # duration infrastructure noise dominates whatever the suite is trying to
    # say, and a lost runner takes the diagnosis with it.
    #
    # FOUR shards: the full suite is ~90 min of tests, so a shard is ~22 min
    # plus ~5 min of setup and ~3 min of TestMain warm-up, which is comfortably
    # under the cap below and well clear of where the runner has been dying.
    # The warm-up is paid PER SHARD — ~12 min of duplicated work total, which is
    # the price of not losing the whole run to one wedged test.
    #
    # THIS IS NOT `t.Parallel()`, which AGENTS.md forbids in this package and
    # still forbids. That rule is about WORKERS INSIDE one job — real containers
    # sharing one runner, and one session image load that must not run per
    # worker. Each shard here is a separate runner with its own machine, its own
    # podman and its own load, so the serial-within-a-job contract is untouched.
    #
    # NOT time-balanced: shards are round-robin over the test-name list, so a
    # shard that happens to collect several slow tests runs longer. Unmeasured
    # and deliberately so — balancing needs per-test costs this job has never
    # produced, and it does not have to be balanced to stop dying.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A CAP, so a wedged shard fails with its log instead of losing the runner.
    # The suite itself still runs with `-timeout 0` — its own per-command
    # deadlines (YOLO_TEST_JAIL_TIMEOUT) are the inner bound; this is the outer
    # one, and its only job is to make a hang reportable.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The CLI expects nix on the macOS host (yolo check gates on it, and
      # per-workspace images with extra packages are nix-built locally,
      # substituting from the NixOS binary cache — see docs/guides/macos.md).
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Podman
        run: |
          # No brew here: Homebrew ships no x86_64 macOS bottles for podman
          # 6.x (Tier 3 on Tahoe Intel → "no bottle available"), and podman
          # v6 dropped Intel macOS builds upstream. v5.8.x is the last line
          # with podman-installer-macos-amd64.pkg, so pin its latest.
          curl -fsSL -o /tmp/podman.pkg \
            "https://github.com/containers/podman/releases/download/v5.8.4/podman-installer-macos-amd64.pkg"
          sudo installer -pkg /tmp/podman.pkg -target /
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"
          # -v /nix:/nix is LOAD-BEARING, not tuning. Since 2026-09-06 yolo's own
          # binaries are BIND-MOUNTED into the jail rather than baked into the
          # image, and a live checkout (which is what this job runs) has to build
          # them — so the mount source is a /nix/store path. Podman Machine shares
          # the user's home and /private, never /nix, so every launch died as
          # `Error: statfs /nix/store/…-yolo-jail-install-prefix/opt/yolo-jail/bin:
          # no such file or directory` with rc 125, taking ~30 tests down on the
          # 2026-09-07 nightly (run 34117863296). `-v` can only be set at init.
          podman machine init --cpus 2 --memory 4096 --disk-size 30 -v /nix:/nix
          podman machine start

      - name: Download jail image
        uses: actions/download-artifact@v8
        with:
          name: jail-image
          path: /tmp

      - name: Load jail image
        run: |
          podman load < /tmp/jail-image.tar
          podman tag yolo-jail:latest localhost/yolo-jail:latest

      # THE PARTITION IS COMPUTED, NOT WRITTEN DOWN. A hand-maintained regex per
      # shard rots the first time somebody adds a test, and it rots SILENTLY —
      # the unassigned test simply never runs and every shard stays green. So
      # each shard derives its own bucket from `go test -list`, which is the
      # same deterministic list for all four, making the union exhaustive by
      # construction.
      - name: Select this shard's tests
        id: shard
        run: |
          set -euo pipefail
          go test -list '.*' ./integration | grep -E '^Test' | sort > /tmp/all-tests
          total=${{ strategy.job-total }}
          idx=${{ matrix.shard }}
          awk -v t="$total" -v i="$idx" 'NR % t == (i - 1) % t' /tmp/all-tests > /tmp/my-tests
          count=$(wc -l < /tmp/my-tests | tr -d ' ')
          echo "shard $idx/$total selected $count of $(wc -l < /tmp/all-tests | tr -d ' ') tests"
          # A SHARD THAT RUNS NOTHING MUST NOT BE GREEN. This is the failure the
          # computed partition can still have — a listing that failed, or a
          # matrix whose length disagrees with job-total — and without this
          # check it reports success having tested nothing, which is worse than
          # a red job because nobody looks at it.
          if [ "$count" -eq 0 ]; then
            echo "::error::shard $idx selected 0 tests — the partition is broken, refusing to pass vacuously"
            exit 1
          fi
          echo "pattern=^($(paste -sd'|' /tmp/my-tests))$" >> "$GITHUB_OUTPUT"

      - name: Integration tests (macOS + Podman)
        run: go test -count=1 -timeout 0 -v -run '${{ steps.shard.outputs.pattern }}' ./integration
        env:
          YOLO_RUNTIME: podman
          # The other half of the -v /nix:/nix above: this is yolo's ONE spelling
          # of "my runtime VM does share /nix into the container" (hostprobes.go's
          # shouldMountHostNix, docs/guides/macos.md). Without it the launcher
          # refuses a store-path install prefix on darwin outright — deliberately,
          # since the alternative is podman's unattributable statfs error — and it
          # also keeps skipping the nix daemon-socket + store mounts this machine
          # can now actually carry. Setting it is the claim, not a workaround.
          YOLO_NIX_HOST_DAEMON: "1"
          # The image this job tests is the one `build-image` built from THIS
          # commit on a Linux runner, downloaded and loaded two steps up. A
          # darwin-side eval of the image attribute cannot vouch for it — the
          # harness already downgrades its own skew check for exactly that
          # reason ("on darwin the image may have been built on a Linux runner")
          # — so every launch here decides the loaded image came from a
          # DIFFERENT source tree and demands a from-source rebuild. That
          # rebuild is an x86_64-linux derivation on a darwin host, so it
          # offloads to the Linux builder container, and THAT PATH HAS NEVER RUN
          # IN THIS JOB: measured 2026-09-09, `nix` cannot reach the builder's
          # published 127.0.0.1:31022 and every test fails as IMAGE BUILD
          # FAILED. It was invisible until the statfs fix let launches get far
          # enough to try. So this job asserts its own state, which is what the
          # hatch is for: the loaded image IS this commit's.
          YOLO_ALLOW_STALE_IMAGE: "1"
          # Intel macOS runner + QEMU podman machine: cold jail starts
          # (mise store bootstrap) and in-test nix image builds run
          # 5-15 minutes — the 300s default killed ten tests
          # sequentially while they warmed shared caches.
          YOLO_TEST_JAIL_TIMEOUT: "1200"
