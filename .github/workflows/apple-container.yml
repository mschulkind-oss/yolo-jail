name: Apple Container parity

# THE BACKEND NO CI JOB HAS EVER RUN.
#
# Every job in this repo that sets YOLO_RUNTIME sets `podman` — ci.yml, nightly-macos.yml
# and packs.yml twice — and macos-user.yml deliberately sets none because that backend
# starts no container. So Apple Container, which the README recommends for macOS, is exercised by
# nothing. Both defects in that class were found by a human on hardware, eight months
# apart: #39 (pack SharedDirs never mounted) and #44 (the staged pack tree never mounted,
# so no agent reached the jail at all).
#
# ⚠ THIS JOB IS THE SMALLER HALF OF THE ANSWER, and it is worth being clear about that
# before reading further. Both defects were ARGV-LEVEL — a mount that was never emitted —
# and an argv is built on Linux, on every push, with no Mac anywhere near it. The guards
# that actually stop the class live in `internal/cli/run/*_test.go`
# (hostpathenv_test.go, acbindsources_test.go, machinetierparity_test.go,
# hosthometier_test.go, and the census in backendparity_test.go). Hardware was needed to
# NOTICE those bugs; it was never needed to CATCH them. What this job adds is the residue
# an argv cannot see: whether `:ro` is really ignored, whether the OCI archive converts,
# whether a path that IS mounted is really readable.
#
# ─── WHY SELF-HOSTED, AND WHY THAT IS NOT A PREFERENCE ───
#
# GitHub-hosted runners cannot run this backend, and the reason is a vice:
#
#   * Apple Container gives every container its own Virtualization.framework VM
#     (docs/guides/macos.md). It needs virtualization on the machine it runs on.
#   * GitHub's Apple Silicon macOS runners do not support nested virtualization — which is
#     exactly why nightly-macos.yml's podman job sits on `macos-26-intel` and says so.
#   * Every Apple Container hardware result this repo has is arm64
#     (docs/research/macos-support-matrix.md: the one hardware proof is macOS 26.5 arm64,
#     Apple Container 0.12.3).
#
# So the arch that can run the backend lacks the virtualization, and the arch with the
# virtualization is the wrong one. There is no hosted path; a Mac the maintainer owns is
# the only instrument.
#
# ─── ⚠ FORK SAFETY: THE TRIGGERS ARE THE WHOLE PROTECTION ───
#
# THIS REPOSITORY IS PUBLIC AND FORKABLE, AND A SELF-HOSTED RUNNER EXECUTES WHATEVER THE
# WORKFLOW TELLS IT TO ON A PERSONAL MACHINE. GitHub's own guidance is that self-hosted
# runners belong on private repositories only, because a fork's pull request can otherwise
# run arbitrary code on your hardware.
#
# What keeps that from happening here is the trigger list below and nothing else:
# `workflow_dispatch` runs the workflow file from the ref it is given and is restricted to
# people with WRITE ACCESS, so a fork cannot cause it. There is no `pull_request`, no
# `pull_request_target`, and no `push`. (There is no `schedule` either, but that is a
# scheduling choice rather than a safety one — see the `on:` block.)
#
# **Do not add a trigger to this file.** If a change here needs testing before it merges,
# dispatch it by hand from its branch — `workflow_dispatch` takes a ref. Adding
# `pull_request` would hand every forker a shell on the maintainer's Mac, and it would look
# like an ordinary convenience commit.
#
# THAT RULE IS ENFORCED, NOT TRUSTED: integration/selfhostedtriggers_test.go fails on any
# fork-causable trigger in any workflow targeting a `self-hosted` runner, and on any such
# workflow missing the `github.repository ==` guard. It runs under `-short`, every push.

on:
  # DISPATCH ONLY, AND THE SCHEDULING LIVES ON THE MAC. There is no `schedule:` here
  # deliberately — `scripts/mac-runner-dispatch.sh`, a launchd agent on the runner itself,
  # is what fires this hourly.
  #
  # ⚠ THIS REPLACED A CRON PLUS A HOSTED POLL JOB, and the reason is worth keeping because
  # the poll was not wrong, it was BACKWARDS.
  #
  # The problem is real: this runner is a personal Mac that is off much of the time, and a
  # cron that targets an absent runner does not fail fast — GitHub QUEUES the job for up to
  # 24 hours and then gives up, so every two hours leaves a trail of amber runs nobody
  # reads (this repo has a nine-day-stale nightly to prove what happens to one of those).
  #
  # The first answer was a hosted `runner-check` job asking
  # `GET /repos/{owner}/{repo}/actions/runners` whether the Mac was online, with this job
  # `if:`-gated on the answer. It cost a fine-grained PAT with `administration: read` in a
  # repository secret, because `administration` is not a scope `permissions:` can grant to
  # GITHUB_TOKEN — so the built-in token cannot ask, and a missing secret looked exactly
  # like a Mac that was switched off (both skip, both green).
  #
  # But a runner is an OUTBOUND long-poll client: it dials GitHub and holds the connection
  # open, which is why a self-hosted runner needs no inbound ports and works behind NAT. So
  # "is the runner online" is a fact about a connection THE MAC opened, and the Mac can read
  # it locally — `launchctl list | grep actions.runner.` — with no credentials at all. The
  # poll asked GitHub what GitHub only knew because the Mac had told it.
  #
  # Inverting it deletes the PAT, the secret, the hosted job and its tri-state, and gains
  # two things a cron could not have: a run fires when the Mac WAKES rather than on the next
  # even hour, and an unchanged commit is not re-run at all (the script records the SHA it
  # dispatched).
  #
  # ⚠ DO NOT ADD A TRIGGER HERE. That rule is unchanged and is now enforced —
  # integration/selfhostedtriggers_test.go fails on any trigger a fork can cause, for any
  # workflow targeting a self-hosted runner. `workflow_dispatch` runs the ref's own workflow
  # file and is restricted to write access, so a fork cannot reach this machine through it.
  workflow_dispatch:

permissions:
  contents: read

# See ci.yml for the full rationale (pinned JS actions that still bundle Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apple-container:
    # TWO CONDITIONS NOW, AND THE ONE THAT WENT IS THE ONE THAT MOVED.
    #
    #   * this is the upstream repository — a fork that somehow dispatched this must not
    #     try to reach the maintainer's machine. This is the half a trigger list cannot
    #     cover, because a fork's own dispatch fires the fork's own copy of this file;
    #   * (implicitly) the trigger, which the `on:` block above restricts to the one that
    #     no fork can cause.
    #
    # "the runner is up" is NO LONGER CHECKED HERE, and that is not a relaxation: the
    # dispatcher on the Mac checks it locally before asking for a run at all
    # (scripts/mac-runner-dispatch.sh, `launchctl list | grep actions.runner.`). Asking on
    # this side needed admin credentials to learn something the Mac already knew — see the
    # `on:` block. A hand-dispatch of a job whose runner is down still queues, which is the
    # residue of the inversion and is fine: a human who typed the command is present to
    # cancel it, which was never true of a cron.
    if: github.repository == 'mschulkind-oss/yolo-jail'
    # TWO LABELS, NOT FOUR, AND THE TWO THAT WENT WERE THE RISKY ONES.
    #
    # This was `[self-hosted, macOS, ARM64, apple-container]` until a real runner existed to
    # check it against (2026-09-14). `apple-container` is a purpose-built label carried by
    # exactly one machine, so `macOS` and `ARM64` narrowed the selection by nothing — while
    # adding two strings that have to match GitHub's auto-label spelling EXACTLY.
    #
    # That is a bad trade, because the failure is not an error. A `runs-on` label no runner
    # carries makes the job sit "waiting for a runner matching the labels" indefinitely —
    # which looks exactly like a machine that is switched off, and is the same
    # indistinguishable-failure shape the deleted probe token had.
    #
    # And the spelling is genuinely not verifiable from the runner side: its own `_diag`
    # logs confirm `self-hosted`, `ARM64` and `apple-container`, but for the OS they say
    # `Darwin` and `OSX` — the internal platform enum — never `macOS`. Reading the label off
    # the API needs the `administration: read` PAT this design exists to avoid.
    #
    # So the job selects on what is confirmed. The OS and arch facts are still REPORTED,
    # by the `Runner facts` step below (`sw_vers`, `uname -m`), which is where a
    # correlation handle belongs rather than in a selector that can hang.
    runs-on: [self-hosted, apple-container]
    name: Apple Container (self-hosted arm64 Mac)
    # A CEILING ON WASTE rather than an estimate — the subset below is four tests and
    # nobody has timed them on this backend. The first green run is the measurement.
    # Sized so one wedged launch still leaves room for the others to report.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI under test is built by the harness with a plain `go build`, so it
          # carries no version stamp and reports a LIVE `git describe` of this checkout
          # instead (internal/version). Depth 1 has no tags to describe.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # INFORMATIONAL, and deliberately not a precondition check: the gate in
      # integration/applecontainer_test.go is the one authority on what this backend needs,
      # and restating its conditions here would be a second copy of them in a language with
      # no test coverage. What this buys is a correlation handle — the `container` version
      # is the variable that decides half of what this job measures (the `:ro` question
      # especially), and a future break wants to know which release it was on.
      - name: Runner facts
        run: |
          sw_vers
          uname -m
          container --version || echo "container: NOT ON PATH"
          container system status || echo "container system: NOT RUNNING"

      # THE IMAGE, AND THE ONE STEP MOST LIKELY TO BE WRONG ON THE FIRST RUN.
      #
      # A darwin machine cannot BUILD the Linux image — there is no Linux builder here —
      # so it must SUBSTITUTE the whole closure. That became possible on 2026-09-13
      # (`1006fe6d`, "push to Cachix on every run"): the image's entire input set is
      # flake.nix + flake.lock, so a darwin eval and a Linux eval produce identical .drv
      # paths and the Mac can fetch what the ubuntu nightly pushed.
      #
      # ⚠⚠ MEASURED 2026-09-14 ON THE FIRST REAL RUN, AND THE PARAGRAPH ABOVE IS WRONG FOR
      # THIS RUNNER. It is kept because the correction needs something to point at.
      #
      # "A darwin eval and a Linux eval produce identical .drv paths" holds only WITHIN ONE
      # ARCHITECTURE. This runner is an arm64 Mac, so it evaluates and needs **aarch64-linux**
      # derivations. The nightly's `build-image` job runs on `ubuntu-latest`, which is x86_64,
      # so what it pushes to Cachix is **x86_64-linux**. The cache is therefore
      # ARCHITECTURALLY INCAPABLE of serving this machine — not stale, not missing a commit,
      # just a different closure. Run 34868855087, verbatim:
      #
      #   required (system, features): (aarch64-linux, [])
      #   cannot build on 'ssh-ng://builder@linux-builder': failed to start SSH connection
      #   Failed to find a machine for remote build!
      #
      # Substitution otherwise worked fine — hundreds of paths came from cache.nixos.org.
      # Exactly five derivations have to be BUILT: nodejs, nix-ld, bin-path-links,
      # yolo-jail-prefix-links and yolo-jail-root.
      #
      # ⚠ AND THIS MAC ALREADY DECLARES A BUILDER THAT CANNOT WORK, which is why the error
      # named SSH rather than the cache. `/etc/nix/nix.custom.conf` carries
      # `builders = ssh-ng://builder@linux-builder aarch64-linux …` and
      # `/etc/ssh/ssh_config.d/100-linux-builder.conf` points it at localhost:31022 — the
      # nix-darwin convention — but nix-darwin is NOT installed here (`/run/current-system`
      # does not exist), so the `/Library/LaunchDaemons/org.yolo-jail.linux-builder.plist`
      # that would start the VM execs a `create-builder` that is absent, and has never once
      # run (no /var/log/yolo-linux-builder.log). A dead stub from 2026-07-16.
      #
      # THE FIX IS THE ONE THIS REPO ALREADY PROVED, one day after that stub was written:
      # docs/plans/runbooks/mac-ac-container-builder.md stands up a Linux builder INSIDE
      # Apple Container, zero sudo, and was verified on this exact hardware 2026-07-17
      # (macOS 26.5 arm64) with the host nix reporting `Trusted: 1` and a proof build
      # returning AC-CONTAINER-BUILDER-WORKS. It removes the Cachix dependency rather than
      # working around it, and it is arch-correct by construction: the builder is aarch64.
      #
      # The other fallback still stands and is now the SECOND choice: copy
      # nightly-macos.yml's shape — an ubuntu `build-image` job that uploads the tar, a
      # download step here, and `container image load -i` (internal/image/image.go is the
      # authority on that argv). ⚠ On an arm64 runner that job would have to build the image
      # for aarch64-linux, which `ubuntu-latest` cannot do either — so it needs an arm64
      # Linux runner, which is the moving part that makes it second.
      - name: Realize the jail image (substituting from Cachix)
        run: |
          set -euo pipefail
          if ! nix build --impure --accept-flake-config --no-link --print-out-paths .#ociImage; then
            echo "::error::could not realize .#ociImage on this Mac. Five derivations must be BUILT (nodejs, nix-ld, bin-path-links, yolo-jail-prefix-links, yolo-jail-root) and this machine has no working Linux builder. ⚠ On an ARM Mac, Cachix cannot help: the nightly pushes x86_64-linux from ubuntu-latest and this host needs aarch64-linux — a different closure, not a stale one. Stand up the Apple Container Linux builder (docs/plans/runbooks/mac-ac-container-builder.md, proven on this hardware 2026-07-17). Note /etc/nix/nix.custom.conf may already declare a linux-builder whose VM cannot start, which is why nix reports an SSH failure rather than a cache miss."
            exit 1
          fi

      # THE PATTERN IS COMPUTED, NOT WRITTEN DOWN — the same rule the macOS nightly's shards
      # follow, for the same reason: a hand-written `-run` regex rots the first time somebody
      # adds a test, and it rots SILENTLY, because the unselected test simply never runs and
      # the job stays green.
      #
      # AND A ZERO-LENGTH SELECTION FAILS. That is the one hole the in-binary gate cannot
      # cover: requireAppleContainer turns "scheduled but the backend is absent" into a red
      # test, but a `-run` pattern matching NOTHING never reaches a test at all and `go test`
      # exits 0 having done nothing. This check is what closes it, and it is why the prefix
      # `TestAppleContainer` is enforced by the gate itself rather than by convention.
      - name: Select the Apple Container parity subset
        id: subset
        run: |
          set -euo pipefail
          go test -list '^TestAppleContainer' ./integration | grep -E '^TestAppleContainer' | sort > /tmp/ac-tests
          count=$(wc -l < /tmp/ac-tests | tr -d ' ')
          echo "selected $count Apple Container parity tests:"
          cat /tmp/ac-tests
          if [ "$count" -eq 0 ]; then
            echo "::error::the listing selected 0 tests named TestAppleContainer… — refusing to pass vacuously. Either the suite was renamed out from under this filter, or ./integration does not compile."
            exit 1
          fi
          echo "pattern=^($(paste -sd'|' /tmp/ac-tests))$" >> "$GITHUB_OUTPUT"

      # DELIBERATELY NOT THE WHOLE SUITE, and that is the difference between a signal and a
      # job nobody reads.
      #
      # Most of ./integration will legitimately fail or skip on this backend: there are no
      # loophole host services, `:ro` is ignored, no `--net` selector is taken, `--add-host`
      # is unsupported (apple/container#673). Pointing the full suite at it on day one would
      # produce dozens of red tests describing known absences, and a job that is red for
      # known reasons teaches nobody anything about the unknown ones.
      #
      # So the subset is four facts that MUST hold, each one a question a Linux test cannot
      # answer, two of them the two shipped issues asked on the hardware that had them.
      # applecontainer_test.go's header states the rule for growing it: one test at a time,
      # each added only after it has passed here.
      - name: Apple Container parity tests
        run: go test -count=1 -timeout 0 -v -run '${{ steps.subset.outputs.pattern }}' ./integration
        env:
          # THE DECLARATION. Set, a test that cannot reach this backend FAILS instead of
          # skipping — because a suite that skips is indistinguishable from a suite that
          # passes, and this one skips on every other machine in the world. Only the step
          # that scheduled the work can say which it is, which is why the declaration lives
          # here and not in the test binary (integration/applecontainer_test.go, and
          # integration/macosusergate_test.go for the fuller version of the argument).
          YOLO_TEST_APPLE_CONTAINER: "1"
          # NOT set job-wide, and not set here either: each test passes YOLO_RUNTIME per
          # LAUNCH (appleContainerEnv), which is the spelling a job-level variable cannot
          # shadow and which keeps a hand-run of one test on this Mac behaving identically.

      # THE RUNNER IS NOT EPHEMERAL, which is the one way this job differs from every other
      # macOS job in this repo — those run on a fresh VM that is thrown away. Here a leaked
      # container, or a workspace the harness could not unlink, persists on somebody's
      # actual laptop until the next run trips over it.
      #
      # Reporting rather than reaping, on purpose: the test fixtures already remove their
      # own containers and workspaces (writeProject's cleanup, forceRemoveContainer), so
      # anything still standing here is EVIDENCE of a fixture that failed to clean up, and
      # a step that silently deleted it would remove the only trace. `|| true` so a
      # post-mortem never turns a green run red.
      - name: Leftovers (report only)
        if: always()
        run: |
          echo "--- containers still present ---"
          container ls --all || true
