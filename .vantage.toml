# Planning: which file is the roadmap, and which paths are not planning documents
# (vendored code, agent and jail state, personal notes, build output).
[planning]
roadmap = "docs/plans/roadmap.md"
exclude = ["vendor/**", ".claude/**", ".yolo/**", "swarf/**", "node_modules/**", "dist-go/**", "result/**"]

# Stage words: what each frontmatter `stage` value means to the planning index.
# CURRENT is evergreen, not a proposal; it maps to built rather than done so a
# reference doc's live questions stay in the queue.
[planning.stages]
SKETCH = "open"
DESIGN = "open"
DECIDED = "ready"
BUILT = "built"
GRADUATED = "done"
SUPERSEDED = "done"
CURRENT = "built"

# Questions here carry a setup story and lettered options that say what the person sees,
# which runs past the 120-word default measured on id-shaped questions (owner, 2026-11-03).
[check.rules."planning/question-length"]
max-words = 160
