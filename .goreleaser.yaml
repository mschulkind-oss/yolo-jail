# goreleaser config. Shape copied from mschulkind-oss/swarf, adapted: like
# swarf, yolo-jail ships ONE host-facing binary: yolo (host CLI, which also
# hosts the daemons via the hidden `yolo internal daemon <name>` subcommands).
# yolo-ps is the in-jail client for the host-processes loophole; it ships only
# inside the NIX IMAGE (inert on the host — no service socket) and so is NOT
# distributed through the host channels. The in-jail daemons (yolo-entrypoint,
# yolo-jaild) also ship inside the NIX IMAGE and must NOT be listed here;
# goprobe is dev-only.
#
# Releasing = `just release <version>`: it refuses unless CHANGELOG.md has a
# written section for the version and the tree is clean, then pushes the v* tag
# that .github/workflows/release.yml runs this config on. The release body is
# that section, passed as --release-notes; see the note where `changelog:` was.
#
# Version stamping: internal/version resolves a baked stamp before live
# `git describe`, so these ldflags are what a released binary reports. buildVersion is intentionally unexported — -X reaches it fine.
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # Stage the PREBUILT "two files and a binary" bundle that ships beside the
    # host binary so a checkout-less install can build the jail image
    # (nix build .#ociImage) with NO Go toolchain and NO source tree — the
    # flake's prebuilt short-circuit consumes bin/linux-<arch> instead of
    # compiling. See scripts/stage-source-bundle.sh + internal/reporoot
    # (BundledSourceDir). This cross-compiles both Linux arches, so it needs the
    # Go toolchain the setup-go step already provides.
    # MUST stage OUTSIDE dist/: GoReleaser's dist.Pipe wipes dist/ right after
    # the before-hooks, so a bundle under dist/ would be deleted before archiving.
    - scripts/stage-source-bundle.sh bundle/share/yolo-jail

builds:
  - id: yolo
    main: ./cmd/yolo
    binary: yolo
    ldflags: &ldflags
      - -s -w
      - -X github.com/mschulkind-oss/yolo-jail/internal/version.buildVersion={{.Version}}
      - -X github.com/mschulkind-oss/yolo-jail/internal/version.GitCommit={{.ShortCommit}}
    env: &buildenv
      - CGO_ENABLED=0
    goos: &oses
      - linux
      - darwin
    goarch: &arches
      - amd64
      - arm64

# One archive per platform containing the yolo binary AND the prebuilt bundle
# (share/yolo-jail/) an installed binary needs to build the jail image. The
# archive lays out `yolo` + `share/yolo-jail/…` at the same level, so once
# unpacked, BundledSourceDir finds the bundle at <exe>/share/yolo-jail (its
# second candidate — see internal/reporoot). The bundle is arch-agnostic (it
# carries bin/linux-{amd64,arm64}), so the SAME staged tree ships in every
# platform archive; the flake selects the matching arch at eval time.
archives:
  - formats: ["tar.gz"]
    name_template: "yolo-jail_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # Copy the staged bundle DIRECTORY, preserving its subtree
      # (flake.nix, flake.lock, bin/linux-<arch>/). With a directory `src`,
      # goreleaser places the contents under `dst` keeping the tree — so files
      # land at share/yolo-jail/… beside the root binary. NO glob + strip_parent
      # (that flattens the tree and breaks the flake's prebuilt-bin layout).
      # NOTE: what is covered and what is not. The LAYOUT this must produce is
      # asserted — internal/reporoot's TestBundledSourceDirFrom builds the
      # release-archive fixture (<root>/yolo + <root>/share/yolo-jail/flake.nix)
      # and requires the resolver to find it. That this src/dst mapping actually
      # produces that layout is NOT: goreleaser is not installed in the dev jail,
      # so nothing runs it until a real release. Homebrew is the primary bundle
      # delivery and does not go through here at all — release.yml generates a
      # SOURCE-BUILD formula (depends_on go) that calls
      # scripts/stage-source-bundle.sh itself; there is no bottle.
      - src: "bundle/share/yolo-jail"
        dst: "share/yolo-jail"

checksum:
  name_template: "checksums.txt"

# NO `changelog:` BLOCK, on purpose. The release body is the tag's CHANGELOG.md
# section, which release.yml extracts with scripts/changelog-section.sh and
# passes as `--release-notes`; goreleaser then loads that file and never builds
# its commit-subject list (the filters that used to sit here shaped a body that
# is no longer published). Do NOT add `changelog: {disable: true}` to make that
# explicit: disabling skips goreleaser's whole changelog pipe, and that pipe is
# also what loads `--release-notes`, so the release would ship with an empty
# body. Checked against goreleaser's internal/pipe/changelog (Skip, then Run's
# early return on ReleaseNotesFile).
